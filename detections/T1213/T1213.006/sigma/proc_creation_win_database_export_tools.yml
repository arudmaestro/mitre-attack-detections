title: 'Database Export Tool Executed on Windows'
id: 22df311c-28ef-470f-b94a-404d7ca9b441
status: experimental
description: 'Detects SQL Server bcp exporting data (out / queryout) and dump tools for MySQL, PostgreSQL and MongoDB.'
references:
  - https://attack.mitre.org/techniques/T1213/006/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.collection
  - attack.t1213.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_bcp:
    Image|endswith: '\bcp.exe'
    CommandLine|contains:
      - ' out '
      - ' queryout '
  selection_dump:
    Image|endswith:
      - '\mysqldump.exe'
      - '\pg_dump.exe'
      - '\pg_dumpall.exe'
      - '\mongodump.exe'
      - '\mongoexport.exe'
  condition: 1 of selection_*
falsepositives:
  - 'Scheduled database backups and ETL jobs (allowlist by host and account)'
level: low
