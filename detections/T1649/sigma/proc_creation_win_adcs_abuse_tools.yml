title: 'AD CS Certificate Abuse Tool Command Line on Windows'
id: 737a6f04-f1cc-41c7-9a61-3c6286fb59e5
status: experimental
description: 'Detects Certify, ForgeCert, Certipy and Rubeus asktgt with /certificate, used to request certificates through vulnerable AD CS templates, forge certificates with a stolen CA key, and authenticate with them.'
references:
  - https://attack.mitre.org/techniques/T1649/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.credential-access
  - attack.t1649
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Certify.exe'
      - 'ForgeCert'
      - 'certipy'
      - ' /certificate:'
  condition: selection
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
