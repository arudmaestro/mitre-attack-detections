title: 'Developer Utility Used to Run Code (csi, rcsi, dnx, cdb, Tracker)'
id: bf8569be-6ad3-45cf-a4df-cfbd07755a1c
status: experimental
description: 'Detects Microsoft developer utilities that can run arbitrary code: C# interactive (csi/rcsi), dnx, cdb with a command script, and Tracker.exe injecting a DLL.'
references:
  - https://attack.mitre.org/techniques/T1127/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.stealth
  - attack.execution
  - attack.t1127
logsource:
  category: process_creation
  product: windows
detection:
  selection_interpreters:
    Image|endswith:
      - '\csi.exe'
      - '\rcsi.exe'
      - '\dnx.exe'
  selection_cdb:
    Image|endswith: '\cdb.exe'
    CommandLine|contains: '-cf'
  selection_tracker:
    Image|endswith: '\tracker.exe'
    CommandLine|contains: ' /d '
  condition: 1 of selection_*
falsepositives:
  - 'Developers using these tools on build or development machines'
level: low
