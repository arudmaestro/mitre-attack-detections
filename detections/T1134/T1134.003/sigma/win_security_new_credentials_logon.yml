title: 'Logon with New Credentials (LogonType 9, seclogo)'
id: 1f00f1b5-1070-45d2-ad88-e92eadf697ab
status: experimental
description: 'Detects LogonType 9 logons by the seclogo process, created by runas /netonly and by token-making tools (e.g. Mimikatz pass-the-hash, Cobalt Strike make_token).'
references:
  - https://attack.mitre.org/techniques/T1134/003/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.stealth
  - attack.privilege-escalation
  - attack.t1134.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 9
    LogonProcessName|contains: 'seclogo'
  condition: selection
falsepositives:
  - 'Administrators using runas /netonly'
level: medium
