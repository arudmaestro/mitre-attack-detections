title: 'System Service Discovery via sc, tasklist or net'
id: 539c94de-400b-4217-b5be-f9bd10f1606e
status: experimental
description: 'Detects service enumeration with sc query/qc, tasklist /svc, or net start without a service name.'
references:
  - https://attack.mitre.org/techniques/T1007/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.discovery
  - attack.t1007
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
      - ' query'
      - ' qc '
  selection_tasklist:
    Image|endswith: '\tasklist.exe'
    CommandLine|contains: '/svc'
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|endswith: ' start'
  condition: 1 of selection_*
falsepositives:
  - Administrators and IT management tools
  - Software installers checking service state
level: low
