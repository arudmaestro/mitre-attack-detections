title: 'Launch Daemon Created or Loaded from the Command Line'
id: 624ca7ca-da33-4155-8ef5-cf01b89f7761
status: experimental
description: 'Detects cp, mv, tee, ln, plutil, defaults or launchctl working on a plist in /Library/LaunchDaemons, i.e. a root launch daemon being created or loaded.'
references:
  - https://attack.mitre.org/techniques/T1543/004/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.004
logsource:
  category: process_creation
  product: macos
detection:
  selection_img:
    Image|endswith:
      - '/cp'
      - '/mv'
      - '/tee'
      - '/ln'
      - '/plutil'
      - '/defaults'
      - '/launchctl'
  selection_path:
    CommandLine|contains: '/Library/LaunchDaemons/'
  condition: all of selection_*
falsepositives:
  - 'Software installers registering daemons'
level: medium
