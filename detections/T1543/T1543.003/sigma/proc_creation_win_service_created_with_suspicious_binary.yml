title: 'Service Created or Changed to Run a Script Host or a File in a User Folder'
id: 913cef8b-9412-4d5b-b27f-5b8410e796cd
status: experimental
description: 'Detects sc.exe create/config and New-Service where the service command uses PowerShell, cmd /c, mshta, script hosts, regsvr32 or a file in Temp or the public profile.'
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_sc:
    Image|endswith: '\sc.exe'
    CommandLine|contains:
      - 'create'
      - 'config'
  selection_ps:
    CommandLine|contains: 'New-Service'
  selection_bin:
    CommandLine|contains:
      - 'powershell'
      - 'pwsh'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'regsvr32'
      - 'cmd.exe /c'
      - 'cmd /c'
      - '%COMSPEC%'
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
  condition: (selection_sc or selection_ps) and selection_bin
falsepositives:
  - 'Software installers that wrap services in a script (rare)'
level: high
