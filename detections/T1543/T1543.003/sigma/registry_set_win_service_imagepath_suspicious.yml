title: 'Service ImagePath Set to a Script Host or a File in a User Folder'
id: d35b2da4-9ba1-468e-9dd9-1be81f31456e
status: experimental
description: 'Detects a service ImagePath registry value that uses PowerShell, cmd /c, %COMSPEC%, mshta, script hosts, regsvr32 or a file in Temp or the public profile. It also catches services created by writing the registry directly.'
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.003
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Services\'
    TargetObject|endswith: '\ImagePath'
    Details|contains:
      - 'powershell'
      - 'pwsh'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'regsvr32'
      - 'cmd.exe /c'
      - 'cmd /c'
      - '%COMSPEC%'
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
  condition: selection
falsepositives:
  - 'Software installers that wrap services in a script (rare)'
level: high
