title: 'Systemd Unit File Written from the Command Line'
id: 675c0c42-a179-41f8-8689-81785ddc49c2
status: experimental
description: 'Detects cp, mv, tee, ln, install or sed writing to a systemd unit directory (system or user), i.e. a service being created or changed outside the package manager.'
references:
  - https://attack.mitre.org/techniques/T1543/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.002
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
      - '/cp'
      - '/mv'
      - '/tee'
      - '/ln'
      - '/install'
      - '/sed'
  selection_path:
    CommandLine|contains:
      - '/etc/systemd/system/'
      - '/lib/systemd/system/'
      - '/run/systemd/system/'
      - '/.config/systemd/user/'
  condition: all of selection_*
falsepositives:
  - 'Configuration management (Ansible, Puppet) and administrators deploying services'
level: low
