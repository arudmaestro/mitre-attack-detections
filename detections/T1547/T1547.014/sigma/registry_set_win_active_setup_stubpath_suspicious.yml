title: 'Active Setup StubPath Set to a Script Host or a File in Temp or Public'
id: 18a87ff0-2ba4-488a-8f50-a3fc32864f74
status: experimental
description: 'Detects an Active Setup component StubPath that starts PowerShell, cmd /c, mshta, script hosts, regsvr32 or a file in Temp or the public profile; StubPath runs once for every user at logon.'
references:
  - https://attack.mitre.org/techniques/T1547/014/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1547.014
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Active Setup\Installed Components\'
    TargetObject|endswith: '\StubPath'
    Details|contains:
      - 'powershell'
      - 'pwsh'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'regsvr32'
      - 'cmd.exe /c'
      - 'cmd /c'
      - '%COMSPEC%'
      - '\AppData\Local\Temp\'
      - '\Users\Public\'
  condition: selection
falsepositives:
  - 'Enterprise software deployment that uses Active Setup scripts per user'
level: medium
