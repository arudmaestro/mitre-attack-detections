title: 'Login Item Added with osascript'
id: 90983b49-7354-460c-810a-bc7a5b56bb65
status: experimental
description: 'Detects osascript telling System Events to make a login item, a common way for scripts and malware to start at every user login.'
references:
  - https://attack.mitre.org/techniques/T1547/015/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1547.015
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/osascript'
    CommandLine|contains:
      - 'make login item'
      - 'make new login item'
  condition: selection
falsepositives:
  - 'Installers and setup scripts that add their application to login items'
level: medium
