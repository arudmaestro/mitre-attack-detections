title: 'LSA Security Support Providers Changed'
id: 8032985f-bc9e-476a-a5d6-f01c8fa88409
status: experimental
description: 'Detects a change to the LSA ''Security Packages'' value (including OSConfig); listed SSP DLLs are loaded into LSASS and can capture plaintext passwords (e.g. mimilib).'
references:
  - https://attack.mitre.org/techniques/T1547/005/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1547.005
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith:
      - '\Control\Lsa\Security Packages'
      - '\Control\Lsa\OSConfig\Security Packages'
  filter_lsass:
    Image|endswith: '\lsass.exe'
  condition: selection and not filter_lsass
falsepositives:
  - 'Security or authentication software installing an SSP'
level: high
