title: 'LSASS Extension DLL Registered under NTDS'
id: 84bce0e3-796c-431e-bafc-20fe57d8061f
status: experimental
description: 'Detects the NTDS DirectoryServiceExtPt or LsaDbExtPt value being set; the DLL is loaded into LSASS on domain controllers.'
references:
  - https://attack.mitre.org/techniques/T1547/008/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1547.008
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith:
      - '\Services\NTDS\DirectoryServiceExtPt'
      - '\Services\NTDS\LsaDbExtPt'
  condition: selection
falsepositives:
  - 'None expected'
level: high
