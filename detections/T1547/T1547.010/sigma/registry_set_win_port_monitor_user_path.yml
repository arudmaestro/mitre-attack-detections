title: 'Print Port Monitor DLL Registered from a User-Writable Folder'
id: 331cb31e-bd48-437d-97ea-32fe792a020e
status: experimental
description: 'Detects a print port monitor Driver value pointing to a DLL in Temp, AppData, Downloads or the public profile; port monitor DLLs are loaded by the print spooler as SYSTEM.'
references:
  - https://attack.mitre.org/techniques/T1547/010/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1547.010
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Control\Print\Monitors\'
    TargetObject|endswith: '\Driver'
    Details|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Users\Public\'
      - '\Downloads\'
  condition: selection
falsepositives:
  - 'None expected'
level: high
