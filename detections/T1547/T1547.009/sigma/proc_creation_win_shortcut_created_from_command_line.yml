title: 'Shortcut Created or Changed from the Command Line'
id: 90e728f0-0918-4947-b9c7-dad084093097
status: experimental
description: 'Detects command lines that use the WScript.Shell CreateShortcut method, used by scripts to create or modify .lnk files (e.g. pointing a desktop shortcut at a payload).'
references:
  - https://attack.mitre.org/techniques/T1547/009/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1547.009
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: 'CreateShortcut'
  condition: selection
falsepositives:
  - 'Deployment and login scripts that create shortcuts'
level: low
