title: 'XDG Autostart Entry Written from the Command Line'
id: 8ab9ec94-c2b5-4709-9770-e999d7988b45
status: experimental
description: 'Detects cp, mv, tee, ln, install or sed writing to an XDG autostart folder; .desktop files there start when a user logs in to a desktop session.'
references:
  - https://attack.mitre.org/techniques/T1547/013/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1547.013
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
      - '/cp'
      - '/mv'
      - '/tee'
      - '/ln'
      - '/install'
      - '/sed'
  selection_path:
    CommandLine|contains:
      - '/.config/autostart/'
      - '/etc/xdg/autostart/'
  condition: all of selection_*
falsepositives:
  - 'Desktop applications and installers adding autostart entries'
level: medium
