title: 'Windows Credential Manager Enumerated'
id: 3e189b7e-2d15-417d-9da4-3cf5e77b317a
status: experimental
description: 'Detects vaultcmd /list..., cmdkey /list and the keymgr.dll KRShowKeyMgr dialog, used to list or open saved Windows and web credentials before extracting them.'
references:
  - https://attack.mitre.org/techniques/T1555/004/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1555.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_vaultcmd:
    Image|endswith: '\vaultcmd.exe'
    CommandLine|contains: '/list'
  selection_cmdkey:
    Image|endswith: '\cmdkey.exe'
    CommandLine|contains: '/list'
  selection_keymgr:
    CommandLine|contains: 'KRShowKeyMgr'
  condition: 1 of selection_*
falsepositives:
  - 'Administrators and helpdesk listing saved credentials'
level: medium
