title: 'Keychain Dumped or Passwords Read with security'
id: b9df80ad-e76a-4acc-8647-98d7fafd0da9
status: experimental
description: 'Detects the security command dumping a keychain (dump-keychain) or reading stored passwords (find-generic-password, find-internet-password).'
references:
  - https://attack.mitre.org/techniques/T1555/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1555.001
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/security'
    CommandLine|contains:
      - 'dump-keychain'
      - 'find-generic-password'
      - 'find-internet-password'
  condition: selection
falsepositives:
  - 'Scripts and developer tools that read their own keychain entries with the security command'
level: medium
