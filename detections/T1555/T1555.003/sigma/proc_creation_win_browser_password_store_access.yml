title: 'Browser Password Store Accessed from the Command Line on Windows'
id: ac505869-554d-4365-b832-4d54a209a97f
status: experimental
description: 'Detects a command line that references browser password stores (Chromium ''Login Data'', Firefox logins.json and key4.db), typical of credential-stealing scripts and tools.'
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1555.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - '\Login Data'
      - '\logins.json'
      - '\key4.db'
  condition: selection
falsepositives:
  - 'Backup, browser-migration and forensic tools'
level: medium
