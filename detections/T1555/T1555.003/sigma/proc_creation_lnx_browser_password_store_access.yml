title: 'Browser Password Store Accessed from the Command Line on Linux'
id: a83b8cfe-3049-4e0e-b886-b0371a8bee8a
status: experimental
description: 'Detects a command line that references browser password stores (Chromium ''Login Data'', Firefox logins.json and key4.db), typical of credential-stealing scripts and tools.'
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1555.003
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - '/Login Data'
      - '/logins.json'
      - '/key4.db'
  condition: selection
falsepositives:
  - 'Backup and browser-migration scripts'
level: medium
