title: 'AWS Secrets Manager Secrets Read in Bulk'
id: c51e1c52-18e4-465a-adf8-65b79d6dc919
status: experimental
description: 'Detects BatchGetSecretValue, which returns the values of many Secrets Manager secrets in one call; attackers use it to collect every secret an identity can read.'
references:
  - https://attack.mitre.org/techniques/T1555/006/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1555.006
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'secretsmanager.amazonaws.com'
    eventName: 'BatchGetSecretValue'
  condition: selection
falsepositives:
  - 'Applications that load several secrets at start-up with BatchGetSecretValue (allowlist their roles)'
level: medium
