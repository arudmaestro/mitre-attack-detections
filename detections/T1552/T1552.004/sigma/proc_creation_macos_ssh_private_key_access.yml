title: 'SSH Private Key Accessed by a Non-SSH Program on macOS'
id: 28cc36b2-64f5-4f22-bf7e-f46a1be33445
status: experimental
description: 'Detects a command line that names a default SSH private key file (~/.ssh/id_rsa, id_ed25519, id_ecdsa, id_dsa) in a program other than ssh, ssh-add or ssh-keygen, e.g. cat, cp, scp, tar or base64.'
references:
  - https://attack.mitre.org/techniques/T1552/004/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.004
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    CommandLine|contains:
      - '/.ssh/id_rsa'
      - '/.ssh/id_ed25519'
      - '/.ssh/id_ecdsa'
      - '/.ssh/id_dsa'
  filter_ssh:
    Image|endswith:
      - '/ssh'
      - '/ssh-add'
      - '/ssh-keygen'
  filter_public:
    CommandLine|contains: '.pub'
  condition: selection and not filter_ssh and not filter_public
falsepositives:
  - 'Administrators copying their own keys'
level: medium
