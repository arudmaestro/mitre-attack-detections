title: 'Certificate Private Key Export from the Command Line'
id: ae7c5f56-3701-421b-b67b-d57b4773d1cb
status: experimental
description: 'Detects command lines that export certificates with their private keys: Export-PfxCertificate, certutil -exportPFX and Mimikatz crypto::capi / crypto::certificates.'
references:
  - https://attack.mitre.org/techniques/T1552/004/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Export-PfxCertificate'
      - 'exportPFX'
      - 'crypto::capi'
      - 'crypto::certificates'
      - 'crypto::cng'
  condition: selection
falsepositives:
  - 'Administrators backing up or migrating certificates'
level: medium
