title: 'Registry Searched for Passwords with reg query'
id: e70433c8-7cf8-44d9-ab79-f6cc723ec9e3
status: experimental
description: 'Detects reg query /f searching the registry for ''password'' (e.g. reg query HKLM /f password /t REG_SZ /s), used to find stored credentials such as autologon, VNC or PuTTY settings.'
references:
  - https://attack.mitre.org/techniques/T1552/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_reg:
    Image|endswith: '\reg.exe'
    CommandLine|contains: ' query '
  selection_find:
    CommandLine|contains: ' /f '
  selection_pass:
    CommandLine|contains: 'passw'
  condition: all of selection_*
falsepositives:
  - 'Administrators auditing the registry for stored passwords'
level: medium
