title: 'Kubernetes Secrets Read with kubectl'
id: add351ec-97cd-4045-b7b1-cf27d116c2d7
status: experimental
description: 'Detects kubectl get or describe on secrets, which returns base64-encoded credentials, tokens and certificates stored in the cluster.'
references:
  - https://attack.mitre.org/techniques/T1552/007/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.007
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/kubectl'
  selection_verb:
    CommandLine|contains:
      - ' get '
      - ' describe '
  selection_secret:
    CommandLine|contains: 'secret'
  condition: all of selection_*
falsepositives:
  - 'Cluster administrators and deployment scripts reading secrets'
level: low
