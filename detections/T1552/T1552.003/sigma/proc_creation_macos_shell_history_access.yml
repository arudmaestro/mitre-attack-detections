title: 'Shell History File Accessed on macOS'
id: f0e3b4b1-f072-457a-b617-5646954380f1
status: experimental
description: 'Detects a command line that references a shell history file (.bash_history, .zsh_history, .sh_history), which can contain passwords typed on the command line.'
references:
  - https://attack.mitre.org/techniques/T1552/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.003
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    CommandLine|contains:
      - '.bash_history'
      - '.zsh_history'
      - '.sh_history'
  condition: selection
falsepositives:
  - 'Administrators reviewing history files; backup tools'
level: low
