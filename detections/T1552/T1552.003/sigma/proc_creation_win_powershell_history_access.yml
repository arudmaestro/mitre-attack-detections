title: 'PowerShell History File Accessed'
id: b56244d6-13db-483c-a427-97b26af8cde2
status: experimental
description: 'Detects a command line that references the PSReadLine history file (ConsoleHost_history.txt) or asks for its location (HistorySavePath); the file can contain passwords typed in PowerShell.'
references:
  - https://attack.mitre.org/techniques/T1552/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ConsoleHost_history'
      - 'HistorySavePath'
  condition: selection
falsepositives:
  - 'Administrators reviewing or clearing their history'
level: low
