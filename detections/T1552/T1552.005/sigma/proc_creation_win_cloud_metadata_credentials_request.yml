title: 'Cloud Instance Metadata Credentials Requested from the Command Line on Windows'
id: 816b8cfb-930c-4c4a-a49f-d4a2b69b388e
status: experimental
description: 'Detects a command line requesting credentials from a cloud instance metadata service: AWS IAM role credentials, Azure managed identity tokens or GCP service account tokens.'
references:
  - https://attack.mitre.org/techniques/T1552/005/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - '/latest/meta-data/iam/security-credentials'
      - '/metadata/identity/oauth2/token'
      - '/computeMetadata/v1/instance/service-accounts/'
  condition: selection
falsepositives:
  - 'Scripts on cloud instances that fetch role credentials (most SDKs do not use a command line)'
level: medium
