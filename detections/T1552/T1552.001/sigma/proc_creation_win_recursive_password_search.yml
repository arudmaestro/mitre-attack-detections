title: 'Recursive Search for Passwords in Files on Windows'
id: 6a0fdcfd-dac8-4dcd-bd29-116b41230c29
status: experimental
description: 'Detects findstr /s or Select-String searching files for ''password'' (also passwd, passwort), used to find credentials in scripts, configuration and unattend files.'
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_findstr:
    Image|endswith: '\findstr.exe'
    CommandLine|contains: '/s'
  selection_ps:
    CommandLine|contains: 'Select-String'
  selection_pass:
    CommandLine|contains: 'passw'
  condition: (selection_findstr or selection_ps) and selection_pass
falsepositives:
  - 'Administrators and security teams searching for exposed passwords'
level: medium
