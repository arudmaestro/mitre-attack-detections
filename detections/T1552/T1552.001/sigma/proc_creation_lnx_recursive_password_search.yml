title: 'Recursive Search for Passwords in Files on Linux'
id: 18ac7b1d-b414-49b8-b981-17996ca55fc0
status: experimental
description: 'Detects grep -r searching files for ''password'' (also passwd), used to find credentials in configuration files, scripts and home directories.'
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
      - '/grep'
      - '/egrep'
  selection_recursive:
    CommandLine|contains:
      - ' -r'
      - ' -ir'
      - ' -nr'
      - ' -inr'
      - ' -nir'
      - '--recursive'
  selection_pass:
    CommandLine|contains: 'passw'
  condition: all of selection_*
falsepositives:
  - 'Administrators and security teams searching for exposed passwords'
level: medium
