title: 'Group Policy Preferences Password Search'
id: 2305c6c1-d764-4d1f-ac4a-13e0e61ee960
status: experimental
description: 'Detects searches for cpassword, the encrypted (with a published key) password field of Group Policy Preferences XML files in SYSVOL, and the Get-GPPPassword / Get-CachedGPPPassword scripts.'
references:
  - https://attack.mitre.org/techniques/T1552/006/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1552.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cpassword'
      - 'Get-GPPPassword'
      - 'Get-CachedGPPPassword'
  condition: selection
falsepositives:
  - 'Security audits looking for leftover GPP passwords'
level: high
