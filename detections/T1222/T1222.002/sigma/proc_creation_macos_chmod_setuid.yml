title: 'Setuid Bit Set with chmod on macOS'
id: 498a3a50-7b38-4082-b4c0-0053dd31492c
status: experimental
description: 'Detects chmod setting the setuid bit (u+s, +s, 4755, 4777, 6755), used to create a root backdoor from a copied shell or binary.'
references:
  - https://attack.mitre.org/techniques/T1222/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.t1222.002
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/chmod'
    CommandLine|contains:
      - 'u+s'
      - ' +s '
      - ' 4755 '
      - ' 4777 '
      - ' 6755 '
  condition: selection
falsepositives:
  - 'Installers and administrators installing setuid tools'
level: medium
