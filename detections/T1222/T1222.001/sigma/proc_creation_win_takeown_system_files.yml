title: 'Ownership of System Files Taken with takeown'
id: 2c74427b-3804-44f6-a3e3-9251864f3705
status: experimental
description: 'Detects takeown.exe taking ownership of files under System32 or SysWOW64, done before replacing system binaries (e.g. accessibility tools).'
references:
  - https://attack.mitre.org/techniques/T1222/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.t1222.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\takeown.exe'
    CommandLine|contains:
      - '\System32\'
      - '\SysWOW64\'
  condition: selection
falsepositives:
  - 'Administrators repairing or customising system files'
level: medium
