title: 'Command Started through a Headless conhost'
id: 0581d916-e0be-42bf-8b3a-40e063290de3
status: experimental
description: 'Detects conhost.exe --headless used to start a command without a visible console window. Console pseudo-terminal sessions (ConPTY) also use --headless but always pass --server, so those are excluded.'
references:
  - https://attack.mitre.org/techniques/T1202/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1202
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\conhost.exe'
    CommandLine|contains: '--headless'
  filter_conpty:
    CommandLine|contains: '--server'
  condition: selection and not filter_conpty
falsepositives:
  - 'Rare: tools that start background consoles this way'
level: medium
