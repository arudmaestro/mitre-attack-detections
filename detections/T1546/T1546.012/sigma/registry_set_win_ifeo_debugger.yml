title: 'Image File Execution Options Debugger Set'
id: 8947fb4e-984d-4be0-a9ac-a0be05d4c27d
status: experimental
description: 'Detects a Debugger value under Image File Execution Options, which makes Windows start the ''debugger'' (any program) instead of, or with, the target executable.'
references:
  - https://attack.mitre.org/techniques/T1546/012/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1546.012
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Image File Execution Options\'
    TargetObject|endswith: '\Debugger'
  filter_known:
    Details|contains:
      - 'procexp'
      - 'vsjitdebugger.exe'
  condition: selection and not filter_known
falsepositives:
  - 'Developers and admins setting debuggers (e.g. replacing Task Manager with Process Explorer)'
level: medium
