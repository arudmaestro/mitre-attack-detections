title: 'Emond Rules Folder Used from the Command Line'
id: aa49388f-7cf4-4247-a4aa-4a5f97b68a7f
status: experimental
description: 'Detects command lines referencing the Event Monitor daemon (emond) rules folder or its emondClients trigger folder, used to install emond persistence.'
references:
  - https://attack.mitre.org/techniques/T1546/014/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1546.014
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    CommandLine|contains:
      - '/etc/emond.d/rules/'
      - '/private/var/db/emondClients'
  condition: selection
falsepositives:
  - 'None expected on current macOS (emond is deprecated)'
level: medium
