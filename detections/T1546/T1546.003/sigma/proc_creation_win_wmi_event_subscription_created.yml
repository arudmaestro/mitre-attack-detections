title: 'Permanent WMI Event Subscription Created from the Command Line'
id: 3c9eed57-ad3c-4116-8872-baf2c60d4d92
status: experimental
description: 'Detects wmic or PowerShell command lines that create WMI event filters, command-line or script consumers, or filter-to-consumer bindings (permanent WMI persistence).'
references:
  - https://attack.mitre.org/techniques/T1546/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1546.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - '__EventFilter'
      - 'CommandLineEventConsumer'
      - 'ActiveScriptEventConsumer'
      - '__FilterToConsumerBinding'
  condition: selection
falsepositives:
  - 'Management agents that register WMI subscriptions (SCCM, some monitoring tools)'
level: high
