title: 'WMI Script Event Consumer Host Running'
id: e013dd4d-fa76-4387-b2b2-38f991fb8e54
status: experimental
description: 'Detects scrcons.exe, the host process for ActiveScriptEventConsumer, which runs VBScript/JScript from a permanent WMI subscription.'
references:
  - https://attack.mitre.org/techniques/T1546/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1546.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\scrcons.exe'
  condition: selection
falsepositives:
  - 'Rare: legacy management scripts using script consumers'
level: high
