title: 'Winlogon Spawning a Command Shell'
id: 89155c9f-89d9-4b06-a55c-a2cce358b916
status: experimental
description: 'Detects winlogon.exe starting cmd.exe or PowerShell, what happens when an accessibility program has been replaced and is triggered at the logon screen.'
references:
  - https://attack.mitre.org/techniques/T1546/008/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1546.008
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\winlogon.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection
falsepositives:
  - 'None expected'
level: high
