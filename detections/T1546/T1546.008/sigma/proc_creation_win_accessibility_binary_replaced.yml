title: 'Accessibility Program Overwritten with copy or move'
id: 713e076f-9f85-4e05-82ad-894059f09b1a
status: experimental
description: 'Detects copy, move, Copy-Item or Move-Item commands targeting an accessibility program (sethc, utilman, osk, Magnify, Narrator, DisplaySwitch, AtBroker).'
references:
  - https://attack.mitre.org/techniques/T1546/008/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1546.008
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_op:
    CommandLine|contains:
      - 'copy '
      - 'move '
      - 'Copy-Item'
      - 'Move-Item'
  selection_target:
    CommandLine|contains:
      - '\sethc.exe'
      - '\utilman.exe'
      - '\osk.exe'
      - '\Magnify.exe'
      - '\Narrator.exe'
      - '\DisplaySwitch.exe'
      - '\AtBroker.exe'
  condition: all of selection_*
falsepositives:
  - 'None expected'
level: high
