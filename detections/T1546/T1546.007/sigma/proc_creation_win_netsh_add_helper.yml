title: 'Netsh Helper DLL Added'
id: feff39cc-af20-4abb-8b24-5eb3c52fb177
status: experimental
description: 'Detects netsh add helper, which registers a DLL that netsh loads every time it runs.'
references:
  - https://attack.mitre.org/techniques/T1546/007/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1546.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\netsh.exe'
    CommandLine|contains: 'add helper'
  condition: selection
falsepositives:
  - 'Rare: VPN or network software registering a helper'
level: high
