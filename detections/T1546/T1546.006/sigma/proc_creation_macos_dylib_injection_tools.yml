title: 'Mach-O Load Command Injection Tool Executed'
id: f9dae5cd-57df-421d-a9d5-36836bbab9f4
status: experimental
description: 'Detects insert_dylib, optool or yololib, tools that add an LC_LOAD_DYLIB command to a Mach-O binary so it loads an attacker library.'
references:
  - https://attack.mitre.org/techniques/T1546/006/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1546.006
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith:
      - '/insert_dylib'
      - '/optool'
      - '/yololib'
  condition: selection
falsepositives:
  - 'iOS/macOS developers and researchers patching binaries'
level: medium
