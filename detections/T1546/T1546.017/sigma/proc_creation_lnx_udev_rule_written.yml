title: 'Udev Rule Written from the Command Line'
id: a7212feb-e336-4065-bd67-4806a16ebd23
status: experimental
description: 'Detects cp, mv, tee, ln, install or sed writing to a udev rules folder; a udev rule can run a program (RUN+=) when a device event occurs.'
references:
  - https://attack.mitre.org/techniques/T1546/017/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1546.017
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
      - '/cp'
      - '/mv'
      - '/tee'
      - '/ln'
      - '/install'
      - '/sed'
  selection_path:
    CommandLine|contains:
      - '/etc/udev/rules.d/'
      - '/lib/udev/rules.d/'
  condition: all of selection_*
falsepositives:
  - 'Administrators and hardware vendor installers adding device rules'
level: medium
