title: 'Rclone Copy or Sync Run on Windows'
id: 28380e1f-b23d-400d-b63c-2018c3f15bce
status: experimental
description: 'Detects rclone copy, sync, move or copyto, a tool widely used by ransomware groups to upload stolen data to cloud storage (MEGA, S3, Dropbox, FTP/SFTP).'
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool:
    CommandLine|contains: 'rclone'
  selection_action:
    CommandLine|contains:
      - ' copy '
      - ' sync '
      - ' move '
      - ' copyto '
  condition: all of selection_*
falsepositives:
  - 'Backup jobs that use rclone (allowlist their host, user and remote)'
level: high
