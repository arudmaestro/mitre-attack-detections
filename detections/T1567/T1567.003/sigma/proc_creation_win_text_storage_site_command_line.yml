title: 'Text Storage Site Referenced on the Command Line on Windows'
id: 76193ea9-9d58-4fbb-bc92-997dec025dba
status: experimental
description: 'Detects a command line that contains a paste-site domain (Pastebin, paste.ee, hastebin, rentry, dpaste, paste.rs, ghostbin), as used by scripts to upload stolen data or download payloads.'
references:
  - https://attack.mitre.org/techniques/T1567/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.exfiltration
  - attack.t1567.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'pastebin.com'
      - 'paste.ee'
      - 'hastebin.com'
      - 'rentry.co'
      - 'dpaste.com'
      - 'paste.rs'
      - 'ghostbin.'
  condition: selection
falsepositives:
  - 'Developers and users opening paste links from the command line or scripts'
level: medium
