title: 'Silver Ticket Forged with Impacket ticketer'
id: 1ecefdf7-ace0-4515-b579-bfe442761698
status: experimental
description: 'Detects Impacket ticketer with -spn, which forges a service ticket for one service with that service account''s key.'
references:
  - https://attack.mitre.org/techniques/T1558/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1558.002
logsource:
  category: process_creation
  product: linux
detection:
  selection_tool:
    CommandLine|contains: 'ticketer'
  selection_spn:
    CommandLine|contains: '-spn'
  condition: all of selection_*
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
