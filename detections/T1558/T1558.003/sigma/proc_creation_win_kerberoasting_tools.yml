title: 'Kerberoasting Tool Command Line on Windows'
id: 7b7e9524-9458-45f6-abd8-c011c29b406c
status: experimental
description: 'Detects Rubeus kerberoast and PowerSploit / Empire Invoke-Kerberoast.'
references:
  - https://attack.mitre.org/techniques/T1558/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1558.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - ' kerberoast'
      - 'Invoke-Kerberoast'
  condition: selection
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
