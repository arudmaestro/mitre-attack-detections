title: 'Kerberoasting with Impacket GetUserSPNs'
id: 41bccf6e-7416-4349-8574-4c74d29eec2b
status: experimental
description: 'Detects Impacket GetUserSPNs with -request, which asks a domain controller for service tickets of all accounts with SPNs and prints them in a crackable format.'
references:
  - https://attack.mitre.org/techniques/T1558/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1558.003
logsource:
  category: process_creation
  product: linux
detection:
  selection_tool:
    CommandLine|contains: 'GetUserSPNs'
  selection_request:
    CommandLine|contains: '-request'
  condition: all of selection_*
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
