title: 'Golden Ticket Forging Command on Windows'
id: 9ca8c714-b007-490d-86d3-4af38ff72892
status: experimental
description: 'Detects command lines that forge a ticket-granting ticket with the KRBTGT key: Mimikatz kerberos::golden with /krbtgt and Rubeus golden.'
references:
  - https://attack.mitre.org/techniques/T1558/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1558.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - '/krbtgt:'
      - ' golden /'
  condition: selection
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
