title: 'Program in a Temp Folder Started with nohup on Linux'
id: a1cf466d-143d-44a3-97bb-c5f2fe8d051d
status: experimental
description: 'Detects nohup running a program or script from /tmp, /dev/shm or /var/tmp; nohup makes the process ignore hang-up signals so it survives the end of the session, a common pattern for miners and backdoors dropped into temp folders.'
references:
  - https://attack.mitre.org/techniques/T1564/011/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.011
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/nohup'
  selection_path:
    CommandLine|contains:
      - '/tmp/'
      - '/dev/shm/'
      - '/var/tmp/'
  condition: all of selection_*
falsepositives:
  - 'Build and test jobs that run programs from /tmp in the background'
level: medium
