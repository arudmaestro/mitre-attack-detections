title: 'Virtual Machine Started Headless on a Windows Host'
id: a7d2e0e4-97b3-4731-9e0e-56c405fd48c5
status: experimental
description: 'Detects VirtualBox VMs started headless (VBoxHeadless, VBoxManage startvm --type headless) and QEMU system emulators; attackers run a VM on a compromised host so their tools run outside the host''s security software.'
references:
  - https://attack.mitre.org/techniques/T1564/006/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_vboxheadless:
    Image|endswith: '\VBoxHeadless.exe'
  selection_vboxmanage_img:
    Image|endswith: '\VBoxManage.exe'
  selection_vboxmanage_start:
    CommandLine|contains: 'startvm'
  selection_vboxmanage_headless:
    CommandLine|contains: 'headless'
  selection_qemu:
    Image|endswith:
      - '\qemu-system-x86_64.exe'
      - '\qemu-system-x86_64w.exe'
      - '\qemu-system-i386.exe'
  condition: selection_vboxheadless or (selection_vboxmanage_img and selection_vboxmanage_start and selection_vboxmanage_headless) or selection_qemu
falsepositives:
  - 'Developers and testers who run virtual machines'
level: medium
