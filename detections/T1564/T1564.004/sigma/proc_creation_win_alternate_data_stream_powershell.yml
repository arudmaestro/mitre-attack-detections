title: 'Alternate Data Stream Written or Read with PowerShell'
id: 3abb0659-e527-4e1d-bbed-f4dde48a5460
status: experimental
description: 'Detects PowerShell -Stream parameters (Set-Content, Add-Content, Get-Content), other than for the Zone.Identifier mark-of-the-web stream, used to hide data or payloads in NTFS alternate data streams.'
references:
  - https://attack.mitre.org/techniques/T1564/004/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: ' -Stream '
  filter_motw:
    CommandLine|contains: 'Zone.Identifier'
  condition: selection and not filter_motw
falsepositives:
  - 'Administration scripts that store metadata in streams'
level: medium
