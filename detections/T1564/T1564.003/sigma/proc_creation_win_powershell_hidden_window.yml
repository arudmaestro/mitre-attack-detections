title: 'PowerShell Started with a Hidden Window'
id: aedb075e-4267-4bb3-af0b-3de5f16055a4
status: experimental
description: 'Detects powershell or pwsh with -WindowStyle Hidden (or any abbreviation such as -w hidden), used by droppers and persistence entries to run without a visible window.'
references:
  - https://attack.mitre.org/techniques/T1564/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_window:
    CommandLine|contains: ' -w'
  selection_hidden:
    CommandLine|contains: 'hidden'
  condition: all of selection_*
falsepositives:
  - 'Logon scripts, SCCM/Intune and monitoring agents that start PowerShell hidden'
level: low
