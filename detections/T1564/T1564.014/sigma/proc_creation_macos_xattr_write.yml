title: 'Extended Attribute Written with xattr on macOS'
id: 5a2ab8f1-3cab-4fae-bf9b-fd330998cc45
status: experimental
description: 'Detects xattr -w, which writes an extended attribute; attackers store encoded payloads in attributes and read them back at run time.'
references:
  - https://attack.mitre.org/techniques/T1564/014/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.014
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/xattr'
    CommandLine|contains: ' -w'
  condition: selection
falsepositives:
  - 'Developers and installers setting attributes such as com.apple.FinderInfo'
level: low
