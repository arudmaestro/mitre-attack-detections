title: 'Extended Attribute Written with setfattr on Linux'
id: a23a1552-aeb2-44f5-8005-cc076f4730e6
status: experimental
description: 'Detects setfattr setting a named extended attribute with a value (-n ... -v), which can store hidden data or payloads that file listings and most scanners do not show.'
references:
  - https://attack.mitre.org/techniques/T1564/014/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.014
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/setfattr'
  selection_name:
    CommandLine|contains: ' -n '
  selection_value:
    CommandLine|contains: ' -v '
  condition: all of selection_*
falsepositives:
  - 'Backup, SELinux and storage tools setting attributes'
level: low
