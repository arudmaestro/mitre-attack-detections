title: 'Inbox Rule That Deletes, Moves or Marks Mail as Read Created with PowerShell'
id: 4e8db32e-c8c6-4f36-a22f-65ac036ed579
status: experimental
description: 'Detects New-InboxRule / Set-InboxRule with -DeleteMessage, -MoveToFolder or -MarkAsRead, used after a mailbox compromise to hide security alerts and replies from the owner.'
references:
  - https://attack.mitre.org/techniques/T1564/008/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.008
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmdlet:
    CommandLine|contains:
      - 'New-InboxRule'
      - 'Set-InboxRule'
  selection_action:
    CommandLine|contains:
      - '-DeleteMessage'
      - '-MoveToFolder'
      - '-MarkAsRead'
  condition: all of selection_*
falsepositives:
  - 'Helpdesk and administrators creating rules for users'
level: medium
