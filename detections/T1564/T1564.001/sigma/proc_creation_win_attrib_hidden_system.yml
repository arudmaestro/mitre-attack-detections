title: 'File Marked Hidden and System with attrib'
id: e0293ee1-412f-42ee-8c59-190b84f82299
status: experimental
description: 'Detects attrib +h +s, which marks a file or folder as hidden and system so Explorer and dir do not show it by default; malware uses it to hide payloads.'
references:
  - https://attack.mitre.org/techniques/T1564/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\attrib.exe'
  selection_hidden:
    CommandLine|contains: '+h'
  selection_system:
    CommandLine|contains: '+s'
  condition: all of selection_*
falsepositives:
  - 'Installers and desktop.ini management scripts'
level: low
