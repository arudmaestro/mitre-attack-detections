title: 'User Account Hidden on macOS'
id: 78114a69-5092-41f8-86bb-a05d27288aa7
status: experimental
description: 'Detects dscl setting IsHidden and changes to the loginwindow HiddenUsersList / Hide500Users settings, which hide accounts from the login window and System Settings.'
references:
  - https://attack.mitre.org/techniques/T1564/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.002
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    CommandLine|contains:
      - 'IsHidden'
      - 'HiddenUsersList'
      - 'Hide500Users'
  condition: selection
falsepositives:
  - 'MDM scripts creating hidden local admin accounts for support'
level: medium
