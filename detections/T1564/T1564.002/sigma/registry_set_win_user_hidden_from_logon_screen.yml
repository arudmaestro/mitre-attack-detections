title: 'User Account Hidden from the Logon Screen'
id: f388ad9a-797e-4a5b-b011-ed971310a5f8
status: experimental
description: 'Detects a value set to 0 under Winlogon\SpecialAccounts\UserList, which hides that local account from the logon screen and user lists; used to hide backdoor accounts.'
references:
  - https://attack.mitre.org/techniques/T1564/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1564.002
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Winlogon\SpecialAccounts\UserList\'
    Details: 'DWORD (0x00000000)'
  condition: selection
falsepositives:
  - 'OEM and management software hiding service or support accounts'
level: high
