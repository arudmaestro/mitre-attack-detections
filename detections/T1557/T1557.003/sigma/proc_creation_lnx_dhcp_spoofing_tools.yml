title: 'DHCP or DHCPv6 Spoofing Tool Executed'
id: 0a862d7a-4082-445f-affc-1134f8de5948
status: experimental
description: 'Detects mitm6, yersinia and dhcpstarv, tools that answer or exhaust DHCP / DHCPv6 so that victims use an attacker-controlled gateway or DNS server.'
references:
  - https://attack.mitre.org/techniques/T1557/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.collection
  - attack.t1557.003
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
      - '/mitm6'
      - '/yersinia'
      - '/dhcpstarv'
  selection_cmd:
    CommandLine|contains: 'mitm6'
  condition: 1 of selection_*
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
