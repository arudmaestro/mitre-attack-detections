title: 'Responder or NTLM Relay Tool Executed on Linux'
id: 63421887-26e2-454b-9b35-395e1500c055
status: experimental
description: 'Detects Responder, ntlmrelayx and MultiRelay, which poison LLMNR / NBT-NS / mDNS answers and capture or relay NTLM authentication.'
references:
  - https://attack.mitre.org/techniques/T1557/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.collection
  - attack.t1557.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_cmd:
    CommandLine|contains:
      - 'Responder.py'
      - 'ntlmrelayx'
      - 'MultiRelay'
  selection_img:
    Image|endswith: '/responder'
  condition: 1 of selection_*
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
