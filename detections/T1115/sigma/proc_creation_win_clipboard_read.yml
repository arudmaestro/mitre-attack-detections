title: 'Clipboard Read from PowerShell'
id: 3291e35b-ecd1-446d-bcd6-fd1e41e3a172
status: experimental
description: 'Detects PowerShell reading clipboard contents with Get-Clipboard or the .NET Clipboard GetText method.'
references:
  - https://attack.mitre.org/techniques/T1115/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Get-Clipboard'
      - 'Clipboard]::GetText'
  condition: selection
falsepositives:
  - 'Admin and productivity scripts that use the clipboard'
level: low
