title: 'Group Policy Changed with PowerShell or GPO Abuse Tools'
id: 9ac13a67-786a-4890-a83e-f972c4b95fe1
status: experimental
description: 'Detects Group Policy PowerShell cmdlets that create, link or change GPO settings, and SharpGPOAbuse options that add scheduled tasks, scripts, local admins or user rights through a GPO.'
references:
  - https://attack.mitre.org/techniques/T1484/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.privilege-escalation
  - attack.t1484.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Set-GPRegistryValue'
      - 'Set-GPPrefRegistryValue'
      - 'New-GPLink'
      - 'SharpGPOAbuse'
      - '--AddComputerTask'
      - '--AddUserTask'
      - '--AddLocalAdmin'
      - '--AddUserRights'
      - '--AddComputerScript'
      - '--AddUserScript'
  condition: selection
falsepositives:
  - 'Administrators managing Group Policy with PowerShell'
level: medium
