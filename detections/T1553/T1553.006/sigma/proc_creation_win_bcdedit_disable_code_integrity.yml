title: 'Driver Signature Enforcement Weakened with bcdedit'
id: e11ebf1a-7a9f-4ba4-8088-aeea7b29a0a7
status: experimental
description: 'Detects bcdedit setting testsigning or nointegritychecks, which lets Windows load unsigned or test-signed drivers and kernel code after a reboot.'
references:
  - https://attack.mitre.org/techniques/T1553/006/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.t1553.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains:
      - 'testsigning'
      - 'nointegritychecks'
  condition: selection
falsepositives:
  - 'Driver developers on test machines'
level: high
