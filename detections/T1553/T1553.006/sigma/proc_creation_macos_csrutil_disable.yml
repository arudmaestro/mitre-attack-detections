title: 'System Integrity Protection Disabled with csrutil'
id: 8dd7a0f4-38f1-42fa-bead-c60f3e636f9a
status: experimental
description: 'Detects csrutil disable (or authenticated-root disable), which turns off System Integrity Protection protections such as kext and system file signing checks.'
references:
  - https://attack.mitre.org/techniques/T1553/006/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.t1553.006
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/csrutil'
    CommandLine|contains: 'disable'
  condition: selection
falsepositives:
  - 'Developers and researchers on test Macs'
level: high
