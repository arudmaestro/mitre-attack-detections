title: 'Trusted Certificate Added with security add-trusted-cert'
id: 03260b79-8e4f-4c6a-90f3-6197bf36db9d
status: experimental
description: 'Detects security add-trusted-cert, which adds a certificate to a keychain and marks it as trusted (e.g. as a root for all users with -d -r trustRoot).'
references:
  - https://attack.mitre.org/techniques/T1553/004/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.t1553.004
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/security'
    CommandLine|contains: 'add-trusted-cert'
  condition: selection
falsepositives:
  - 'MDM, VPN and TLS inspection software installing their root'
level: medium
