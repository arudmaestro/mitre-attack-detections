title: 'CA Certificate Written to the Trust Store on Linux'
id: 3f155cf4-cf8a-419c-b84c-d5468d3cc61e
status: experimental
description: 'Detects cp, mv, tee, ln, install or sed writing to the local CA trust folders (/usr/local/share/ca-certificates, /etc/pki/ca-trust/source/anchors), which update-ca-certificates / update-ca-trust add to the system trust store.'
references:
  - https://attack.mitre.org/techniques/T1553/004/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.t1553.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
      - '/cp'
      - '/mv'
      - '/tee'
      - '/ln'
      - '/install'
      - '/sed'
  selection_path:
    CommandLine|contains:
      - '/usr/local/share/ca-certificates/'
      - '/etc/pki/ca-trust/source/anchors/'
  condition: all of selection_*
falsepositives:
  - 'Configuration management deploying the corporate root CA'
level: medium
