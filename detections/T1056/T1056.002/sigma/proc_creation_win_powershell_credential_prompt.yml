title: 'Credential Prompt Invoked from PowerShell Command Line'
id: e62b00fd-4d2a-4f85-977c-e1006929e303
status: experimental
description: 'Detects command lines calling PromptForCredential or CredUIPromptForCredentials to show a credential dialog.'
references:
  - https://attack.mitre.org/techniques/T1056/002/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.collection
  - attack.credential-access
  - attack.t1056.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'PromptForCredential'
      - 'CredUIPromptForCredentials'
  condition: selection
falsepositives:
  - 'Admin scripts that prompt for credentials'
level: medium
