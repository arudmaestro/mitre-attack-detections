title: 'Fake Password Prompt via osascript'
id: 370ef9cf-ee23-4e74-bb27-127d49b772a1
status: experimental
description: 'Detects osascript displaying a dialog that asks for a password or uses a hidden answer field, a common way to phish the user''s macOS password.'
references:
  - https://attack.mitre.org/techniques/T1056/002/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.collection
  - attack.credential-access
  - attack.t1056.002
logsource:
  category: process_creation
  product: macos
detection:
  selection_img:
    Image|endswith: '/osascript'
  selection_dialog:
    CommandLine|contains: 'display dialog'
  selection_secret:
    CommandLine|contains:
      - 'hidden answer'
      - 'password'
  condition: all of selection_*
falsepositives:
  - 'Legitimate admin scripts that prompt for credentials'
level: high
