title: 'Backup, Database or Security Service Stopped'
id: 5132afa2-5987-479b-a58a-1c9d2949cd14
status: experimental
description: 'Detects net/sc stop, taskkill or Stop-Service aimed at SQL Server, Exchange, Volume Shadow Copy, Windows Backup, Veeam, Backup Exec, Acronis or Sophos, which ransomware stops before encrypting.'
references:
  - https://attack.mitre.org/techniques/T1489/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1489
logsource:
  category: process_creation
  product: windows
detection:
  selection_stop:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
      - '\sc.exe'
    CommandLine|contains: ' stop '
  selection_kill:
    Image|endswith: '\taskkill.exe'
  selection_ps:
    CommandLine|contains: 'Stop-Service'
  selection_target:
    CommandLine|contains:
      - 'MSSQL'
      - 'SQLWriter'
      - 'SQLAgent'
      - 'sqlservr'
      - 'MSExchange'
      - 'VSS'
      - 'wbengine'
      - 'Veeam'
      - 'BackupExec'
      - 'Acronis'
      - 'Sophos'
  condition: (selection_stop or selection_kill or selection_ps) and selection_target
falsepositives:
  - 'Database and backup maintenance scripts that stop services for patching'
level: medium
