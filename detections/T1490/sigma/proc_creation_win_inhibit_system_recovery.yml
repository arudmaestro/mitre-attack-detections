title: 'Shadow Copies, Backups or Boot Recovery Deleted or Disabled'
id: deaf2c80-edd5-481a-9bd8-da0ace14640c
status: experimental
description: 'Detects deletion of Volume Shadow Copies (vssadmin, wmic, WMI Win32_Shadowcopy), shrinking of shadow storage, deletion of the Windows Backup catalog or backups (wbadmin), and disabling of Windows recovery (bcdedit).'
references:
  - https://attack.mitre.org/techniques/T1490/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains:
      - 'delete shadows'
      - 'resize shadowstorage'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains:
      - 'delete catalog'
      - 'delete systemstatebackup'
      - 'delete backup'
  selection_bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains:
      - 'recoveryenabled'
      - 'ignoreallfailures'
  selection_ps_class:
    CommandLine|contains: 'Win32_Shadowcopy'
  selection_ps_action:
    CommandLine|contains:
      - 'Delete'
      - 'Remove-WmiObject'
      - 'Remove-CimInstance'
  condition: selection_vssadmin or selection_wmic or selection_wbadmin or selection_bcdedit or (selection_ps_class and selection_ps_action)
falsepositives:
  - 'Backup software rotating its own shadow copies (check the parent process)'
  - 'Administrators freeing disk space'
level: high
