title: 'Cached Domain Credentials Access'
id: 60e917ec-c93b-424e-8337-87a5b2381ce6
status: experimental
description: 'Detects access to cached domain credentials (DCC2) via the Mimikatz lsadump::cache module or reg.exe on HKLM\SECURITY\Cache.'
references:
  - https://attack.mitre.org/techniques/T1003/005/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1003.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_mimikatz:
    CommandLine|contains: 'lsadump::cache'
  selection_reg:
    Image|endswith: '\reg.exe'
    CommandLine|contains: 'security\cache'
  condition: 1 of selection_*
falsepositives:
  - Authorised security testing
level: high
