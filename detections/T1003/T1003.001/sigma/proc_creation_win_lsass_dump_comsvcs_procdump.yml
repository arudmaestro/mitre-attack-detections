title: 'LSASS Memory Dump via Comsvcs MiniDump or ProcDump'
id: 87c20870-1627-4277-9953-8530f1f2c6e3
status: experimental
description: 'Detects LSASS memory dumping with rundll32 and comsvcs.dll MiniDump, or ProcDump -ma against lsass.'
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_comsvcs_img:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains: 'comsvcs'
  selection_comsvcs_fn:
    CommandLine|contains:
      - 'minidump'
      - '#24'
  selection_procdump:
    CommandLine|contains|all:
      - ' -ma '
      - 'lsass'
  condition: (selection_comsvcs_img and selection_comsvcs_fn) or selection_procdump
falsepositives:
  - Troubleshooting LSASS crashes with ProcDump under change control
level: high
