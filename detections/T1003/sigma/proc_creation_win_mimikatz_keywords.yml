title: 'Mimikatz Module Keywords in Command Line'
id: 34c4da1b-540f-4f9e-956c-9cc1a65d66ba
status: experimental
description: 'Detects Mimikatz module::command keywords (sekurlsa::, lsadump::, etc.) in a process command line.'
references:
  - https://attack.mitre.org/techniques/T1003/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'kerberos::'
      - 'crypto::'
      - 'dpapi::'
      - 'vault::'
      - 'token::elevate'
      - 'privilege::debug'
  condition: selection
falsepositives:
  - Authorised red team or penetration testing
level: high
