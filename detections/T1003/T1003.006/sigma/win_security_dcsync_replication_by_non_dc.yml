title: 'DCSync - Directory Replication Requested by Non-DC Account'
id: 594054d9-0e78-4b52-80a5-99c4ebcfd84c
status: experimental
description: 'Detects directory replication rights (DS-Replication-Get-Changes / -All / -In-Filtered-Set) used by an account that is not a domain controller.'
references:
  - https://attack.mitre.org/techniques/T1003/006/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1003.006
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    AccessMask: '0x100'
    Properties|contains:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
      - '89e95b76-444d-4c62-991a-0facbeda640c'
  filter_machine_accounts:
    SubjectUserName|endswith: '$'
  filter_aadconnect:
    SubjectUserName|startswith: 'MSOL_'
  condition: selection and not 1 of filter_*
falsepositives:
  - Azure AD / Entra Connect sync accounts not named MSOL_*
  - Other legitimate replication tools (e.g. some identity or backup products)
level: high
