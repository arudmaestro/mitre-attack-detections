title: 'SECURITY Registry Hive Saved via reg.exe'
id: 226bd43a-8fd7-43b0-8c51-da3c4889fa72
status: experimental
description: 'Detects reg.exe saving or exporting the SECURITY hive, which holds LSA secrets and cached credentials.'
references:
  - https://attack.mitre.org/techniques/T1003/004/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1003.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\reg.exe'
  selection_action:
    CommandLine|contains:
      - ' save '
      - ' export '
  selection_hive:
    CommandLine|contains:
      - 'hklm\security'
      - 'hkey_local_machine\security'
  condition: all of selection_*
falsepositives:
  - Backup or forensic tooling that exports hives
level: high
