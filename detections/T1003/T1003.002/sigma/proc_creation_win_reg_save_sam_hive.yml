title: 'SAM Registry Hive Saved via reg.exe'
id: dc3d5d1a-6e00-4678-b117-00a34535d40d
status: experimental
description: 'Detects reg.exe saving or exporting the SAM hive, which holds local account password hashes.'
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\reg.exe'
  selection_action:
    CommandLine|contains:
      - ' save '
      - ' export '
  selection_hive:
    CommandLine|contains:
      - 'hklm\sam'
      - 'hkey_local_machine\sam'
  condition: all of selection_*
falsepositives:
  - Backup or forensic tooling that exports hives
level: high
