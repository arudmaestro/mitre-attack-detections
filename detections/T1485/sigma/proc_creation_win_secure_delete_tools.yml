title: 'Secure Deletion or Free-Space Wipe on Windows'
id: bf17cb01-00d4-4e9e-a848-6d1bc74cffe7
status: experimental
description: 'Detects SysInternals SDelete and cipher /w:, which overwrite files or free disk space so data cannot be recovered.'
references:
  - https://attack.mitre.org/techniques/T1485/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1485
logsource:
  category: process_creation
  product: windows
detection:
  selection_sdelete:
    Image|endswith:
      - '\sdelete.exe'
      - '\sdelete64.exe'
      - '\sdelete64a.exe'
  selection_cipher:
    Image|endswith: '\cipher.exe'
    CommandLine|contains: '/w:'
  condition: 1 of selection_*
falsepositives:
  - 'Administrators securely wiping disks before decommissioning'
level: medium
