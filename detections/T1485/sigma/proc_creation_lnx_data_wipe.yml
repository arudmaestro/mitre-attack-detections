title: 'File Shredding or Disk Overwrite on Linux'
id: e543d478-dcd0-4fe0-922c-f8f1a3777b4c
status: experimental
description: 'Detects shred, wipe or srm, and dd writing zeros or random data to a disk device.'
references:
  - https://attack.mitre.org/techniques/T1485/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1485
logsource:
  category: process_creation
  product: linux
detection:
  selection_shred:
    Image|endswith:
      - '/shred'
      - '/wipe'
      - '/srm'
  selection_dd:
    Image|endswith: '/dd'
    CommandLine|contains:
      - 'if=/dev/zero'
      - 'if=/dev/urandom'
      - 'if=/dev/random'
  selection_dd_target:
    CommandLine|contains:
      - 'of=/dev/sd'
      - 'of=/dev/nvme'
      - 'of=/dev/vd'
      - 'of=/dev/xvd'
      - 'of=/dev/hd'
      - 'of=/dev/mapper/'
  condition: selection_shred or (selection_dd and selection_dd_target)
falsepositives:
  - 'Administrators wiping disks before reuse'
  - 'Scripts that shred temporary secrets'
level: medium
