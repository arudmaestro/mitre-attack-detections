title: 'Script File Opened from Downloads, Temp or Outlook Attachments'
id: 5e7dd240-866c-4ae0-a151-a3796bc5e746
status: experimental
description: 'Detects wscript, cscript or mshta running a script from the Downloads folder, a temporary folder (including files opened from ZIP archives) or the Outlook attachment cache, the usual result of a user opening a malicious script attachment.'
references:
  - https://attack.mitre.org/techniques/T1204/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.execution
  - attack.t1204.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  selection_path:
    CommandLine|contains:
      - '\Downloads\'
      - '\AppData\Local\Temp\'
      - '\Content.Outlook\'
      - '\INetCache\'
  condition: all of selection_*
falsepositives:
  - 'Installers and login scripts that run VBScript from a temporary folder'
level: medium
