title: 'Impacket or NetExec Authentication with an NTLM Hash'
id: c787704f-e83d-4829-b962-17af88b2931d
status: experimental
description: 'Detects Impacket remote-execution and dumping scripts run with -hashes, and NetExec / CrackMapExec run with -H, i.e. pass-the-hash from a Linux host.'
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.lateral-movement
  - attack.t1550.002
logsource:
  category: process_creation
  product: linux
detection:
  selection_impacket_tool:
    CommandLine|contains:
      - 'psexec'
      - 'wmiexec'
      - 'smbexec'
      - 'atexec'
      - 'dcomexec'
      - 'secretsdump'
  selection_impacket_hash:
    CommandLine|contains: '-hashes'
  selection_nxc_tool:
    CommandLine|contains:
      - 'nxc'
      - 'netexec'
      - 'crackmapexec'
  selection_nxc_hash:
    CommandLine|contains: ' -H '
  condition: (selection_impacket_tool and selection_impacket_hash) or (selection_nxc_tool and selection_nxc_hash)
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
