title: 'Pass-the-Hash Tool Command Line on Windows'
id: 3a4bf8d0-a118-4502-a145-b8c0fb40eea7
status: experimental
description: 'Detects command lines of tools that authenticate with an NTLM hash instead of a password: Mimikatz sekurlsa::pth and the Invoke-TheHash PowerShell scripts (Invoke-SMBExec, Invoke-WMIExec, Invoke-SMBClient).'
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.lateral-movement
  - attack.t1550.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa::pth'
      - 'Invoke-TheHash'
      - 'Invoke-SMBExec'
      - 'Invoke-WMIExec'
      - 'Invoke-SMBClient'
  condition: selection
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
