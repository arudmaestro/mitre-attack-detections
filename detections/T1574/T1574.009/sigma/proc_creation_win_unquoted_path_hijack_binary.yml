title: 'Program Started from an Unquoted Service Path Hijack Location'
id: f9d8e400-f3fa-4cb2-af26-bea8f2d7a223
status: experimental
description: 'Detects a process whose executable is C:\Program.exe or Common.exe directly in a Program Files folder, the files Windows tries first when a service or shortcut path with spaces is not quoted.'
references:
  - https://attack.mitre.org/techniques/T1574/009/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.stealth
  - attack.execution
  - attack.t1574.009
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - ':\Program.exe'
      - ':\Program Files\Common.exe'
      - ':\Program Files (x86)\Common.exe'
  condition: selection
falsepositives:
  - 'None expected'
level: high
