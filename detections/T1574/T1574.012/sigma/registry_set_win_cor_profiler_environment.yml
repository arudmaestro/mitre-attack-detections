title: '.NET Profiler Environment Variable Set (COR_PROFILER)'
id: e3dbcb3a-3a16-45a9-a4a9-7daf06d09d9a
status: experimental
description: 'Detects COR_ENABLE_PROFILING, COR_PROFILER, COR_PROFILER_PATH or their CORECLR_ equivalents written to an environment registry key; every .NET process started afterwards loads the profiler DLL.'
references:
  - https://attack.mitre.org/techniques/T1574/012/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.stealth
  - attack.execution
  - attack.t1574.012
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith:
      - '\COR_ENABLE_PROFILING'
      - '\COR_PROFILER'
      - '\COR_PROFILER_PATH'
      - '\CORECLR_ENABLE_PROFILING'
      - '\CORECLR_PROFILER'
      - '\CORECLR_PROFILER_PATH'
  condition: selection
falsepositives:
  - 'APM and profiling agents (Dynatrace, AppDynamics, New Relic, Datadog) that register a .NET profiler'
level: medium
