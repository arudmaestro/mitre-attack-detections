title: '.NET AppDomainManager Environment Variable Set'
id: b9951d6e-d2c0-44b6-a1b2-ae6ae2461cc9
status: experimental
description: 'Detects APPDOMAIN_MANAGER_ASM or APPDOMAIN_MANAGER_TYPE written to an environment registry key; .NET Framework processes then load the named assembly as their AppDomain manager (AppDomainManager injection).'
references:
  - https://attack.mitre.org/techniques/T1574/014/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.stealth
  - attack.execution
  - attack.t1574.014
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith:
      - '\APPDOMAIN_MANAGER_ASM'
      - '\APPDOMAIN_MANAGER_TYPE'
  condition: selection
falsepositives:
  - 'None expected'
level: high
