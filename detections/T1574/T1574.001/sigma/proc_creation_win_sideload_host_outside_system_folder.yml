title: 'DLL Side-Loading Host Program Running Outside Its Normal Folder'
id: deca6001-564e-4077-b703-2301e2480c4f
status: experimental
description: 'Detects Microsoft programs that are often copied out with a malicious DLL next to them (dism, winsat, wermgr, MpCmdRun, NisSrv, msdtc, consent, colorcpl) running from anywhere other than the Windows, WinSxS or Defender program folders.'
references:
  - https://attack.mitre.org/techniques/T1574/001/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.stealth
  - attack.execution
  - attack.t1574.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\dism.exe'
      - '\winsat.exe'
      - '\wermgr.exe'
      - '\MpCmdRun.exe'
      - '\NisSrv.exe'
      - '\msdtc.exe'
      - '\consent.exe'
      - '\colorcpl.exe'
  filter_normal:
    Image|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
      - 'C:\Windows\WinSxS\'
      - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
      - 'C:\Program Files\Windows Defender\'
  condition: selection and not filter_normal
falsepositives:
  - 'Windows servicing copies of dism.exe in temporary folders during updates; Windows installed on another drive letter'
level: high
