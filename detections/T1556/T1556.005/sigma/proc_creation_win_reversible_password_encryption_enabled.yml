title: 'Reversible Password Encryption Enabled with PowerShell'
id: 17ab5590-3cb4-43c7-bc78-42d17979853d
status: experimental
description: 'Detects AllowReversiblePasswordEncryption in a command line (Set-ADUser, Set-ADAccountControl, Set-ADDefaultDomainPasswordPolicy, fine-grained policies); passwords set afterwards are stored so they can be decrypted from the domain database.'
references:
  - https://attack.mitre.org/techniques/T1556/005/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.persistence
  - attack.credential-access
  - attack.t1556.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: 'AllowReversiblePasswordEncryption'
  condition: selection
falsepositives:
  - 'Legacy applications that need reversible encryption (CHAP, Digest authentication); usually setting it to $false'
level: medium
