title: 'Mimikatz Skeleton Key Command'
id: 700bafd4-908d-4ded-8c86-eabac2a1230c
status: experimental
description: 'Detects misc::skeleton, the Mimikatz command that patches LSASS on a domain controller so that one master password works for every account.'
references:
  - https://attack.mitre.org/techniques/T1556/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.persistence
  - attack.credential-access
  - attack.t1556.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: 'misc::skeleton'
  condition: selection
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
