title: 'AADInternals Hybrid Identity Backdoor Command'
id: becbac53-6c27-4eb2-b0cb-0687feaa5379
status: experimental
description: 'Detects AADInternals commands that backdoor hybrid identity: installing the pass-through authentication spy, registering a rogue PTA agent, or changing pass-through authentication / seamless SSO settings.'
references:
  - https://attack.mitre.org/techniques/T1556/007/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.defense-impairment
  - attack.persistence
  - attack.credential-access
  - attack.t1556.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Install-AADIntPTASpy'
      - 'Register-AADIntPTAAgent'
      - 'Set-AADIntPassThroughAuthentication'
      - 'Set-AADIntDesktopSSO'
  condition: selection
falsepositives:
  - 'Penetration tests and red-team exercises'
level: high
