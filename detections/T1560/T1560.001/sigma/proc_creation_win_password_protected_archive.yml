title: 'Password-Protected Archive Created with 7-Zip or WinRAR'
id: 00d8d085-d9a0-472d-ae0d-4d42eee624a9
status: experimental
description: 'Detects 7-Zip or WinRAR adding files to an archive with a password (-p, -hp), commonly used to stage collected data before exfiltration so its content is hidden from inspection.'
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\7z.exe'
      - '\7za.exe'
      - '\7zr.exe'
      - '\rar.exe'
      - '\WinRAR.exe'
  selection_add:
    CommandLine|contains: ' a '
  selection_password:
    CommandLine|contains:
      - ' -p'
      - ' -hp'
  condition: all of selection_*
falsepositives:
  - 'Users and backup jobs creating encrypted archives'
level: medium
