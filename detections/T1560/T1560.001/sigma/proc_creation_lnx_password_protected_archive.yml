title: 'Password-Protected Archive Created on Linux'
id: f3873238-9c14-4595-9644-79f21a9f5573
status: experimental
description: 'Detects zip with -e / -P / --encrypt / --password, and 7z adding files with -p, used to stage collected data in encrypted archives before exfiltration.'
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_zip_img:
    Image|endswith: '/zip'
  selection_zip_pass:
    CommandLine|contains:
      - ' -e '
      - ' -P '
      - ' --encrypt'
      - ' --password'
  selection_7z_img:
    Image|endswith:
      - '/7z'
      - '/7za'
      - '/7zz'
  selection_7z_add:
    CommandLine|contains: ' a '
  selection_7z_pass:
    CommandLine|contains: ' -p'
  condition: (selection_zip_img and selection_zip_pass) or (selection_7z_img and selection_7z_add and selection_7z_pass)
falsepositives:
  - 'Users and backup jobs creating encrypted archives'
level: medium
