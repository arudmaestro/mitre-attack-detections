title: 'osascript Shell Script Run with Administrator Privileges'
id: 6c47ea57-e286-4551-b02b-73f27ae8144f
status: experimental
description: 'Detects osascript ''do shell script ... with administrator privileges'', which shows a password prompt and runs the command as root; malware uses it to trick users into granting root.'
references:
  - https://attack.mitre.org/techniques/T1548/004/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.t1548.004
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/osascript'
    CommandLine|contains: 'with administrator privileges'
  condition: selection
falsepositives:
  - 'Installers and admin scripts that ask for elevation with osascript'
level: medium
