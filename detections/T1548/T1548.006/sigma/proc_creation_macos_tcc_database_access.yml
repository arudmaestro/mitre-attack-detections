title: 'TCC Database Accessed from the Command Line'
id: 5414273d-8701-4c8e-bcb2-1f2d0186d54b
status: experimental
description: 'Detects a command line that references TCC.db, the database that stores privacy permissions (camera, microphone, full disk access); reading or editing it with sqlite3 is used to grant malware permissions or to list what is allowed.'
references:
  - https://attack.mitre.org/techniques/T1548/006/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.t1548.006
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    CommandLine|contains: 'TCC.db'
  condition: selection
falsepositives:
  - 'Security and MDM tools that audit TCC permissions'
level: medium
