title: 'Auto-Elevating Windows Program Started a Child Process'
id: 8521aaee-00d2-478f-aac3-3c4cb5369a24
status: experimental
description: 'Detects fodhelper, computerdefaults, wsreset or eventvwr starting another program (other than conhost, WerFault or mmc). These auto-elevate without a UAC prompt, and a child process usually means a hijacked handler (UAC bypass).'
references:
  - https://attack.mitre.org/techniques/T1548/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.privilege-escalation
  - attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith:
      - '\fodhelper.exe'
      - '\computerdefaults.exe'
      - '\wsreset.exe'
      - '\eventvwr.exe'
  filter_normal:
    Image|endswith:
      - '\conhost.exe'
      - '\WerFault.exe'
      - '\mmc.exe'
  condition: selection and not filter_normal
falsepositives:
  - 'Rare: troubleshooting tools started from Event Viewer'
level: high
