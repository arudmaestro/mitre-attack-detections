title: 'Password Policy Discovery with pwpolicy'
id: 23ca6d10-c94e-48be-8048-579b540b97d0
status: experimental
description: 'Detects pwpolicy getaccountpolicies, which prints the macOS account password policy.'
references:
  - https://attack.mitre.org/techniques/T1201/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1201
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/pwpolicy'
    CommandLine|contains: 'getaccountpolicies'
  condition: selection
falsepositives:
  - 'Administrators and MDM or compliance tools checking password settings'
level: low
