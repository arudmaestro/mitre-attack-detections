title: 'Password Policy Discovery on Windows'
id: a64e1eb1-b011-4657-903a-c1e20efb2fe9
status: experimental
description: 'Detects password policy enumeration with net accounts or the Active Directory PowerShell cmdlets for default and fine-grained password policies.'
references:
  - https://attack.mitre.org/techniques/T1201/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1201
logsource:
  category: process_creation
  product: windows
detection:
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains: ' accounts'
  selection_ps:
    CommandLine|contains:
      - 'Get-ADDefaultDomainPasswordPolicy'
      - 'Get-ADFineGrainedPasswordPolicy'
  condition: 1 of selection_*
falsepositives:
  - 'Administrators and audit scripts reviewing password policy'
level: low
