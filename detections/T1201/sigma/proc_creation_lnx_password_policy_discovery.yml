title: 'Password Policy Discovery on Linux'
id: 3de271e2-ccd2-4e35-bda6-c8e6f551ef58
status: experimental
description: 'Detects chage -l and commands that read the PAM / login.defs password policy files.'
references:
  - https://attack.mitre.org/techniques/T1201/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1201
logsource:
  category: process_creation
  product: linux
detection:
  selection_chage:
    Image|endswith: '/chage'
    CommandLine|contains: '-l'
  selection_files:
    CommandLine|contains:
      - '/etc/login.defs'
      - '/etc/security/pwquality.conf'
      - '/etc/pam.d/common-password'
      - '/etc/pam.d/system-auth'
  condition: 1 of selection_*
falsepositives:
  - 'Administrators and compliance scanners checking password settings'
level: low
