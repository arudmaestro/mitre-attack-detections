title: 'Shutdown or Reboot Command on Linux'
id: 191b8bfe-eed6-438c-ba18-32c464503dbf
status: experimental
description: 'Detects shutdown, reboot, poweroff and halt, and systemctl reboot/poweroff/halt.'
references:
  - https://attack.mitre.org/techniques/T1529/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1529
logsource:
  category: process_creation
  product: linux
detection:
  selection_bin:
    Image|endswith:
      - '/shutdown'
      - '/reboot'
      - '/poweroff'
      - '/halt'
  selection_systemctl:
    Image|endswith: '/systemctl'
    CommandLine|contains:
      - 'reboot'
      - 'poweroff'
      - 'halt'
  condition: 1 of selection_*
falsepositives:
  - 'Administrators and patching tools restarting systems'
level: low
