title: 'Forced Shutdown or Reboot on Windows'
id: cb96ca58-81de-4627-83fd-0fbdaa7d6dac
status: experimental
description: 'Detects shutdown.exe with a shutdown or restart switch together with /f (force-close applications), the form used by ransomware and wipers to finish their impact.'
references:
  - https://attack.mitre.org/techniques/T1529/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1529
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\shutdown.exe'
  selection_action:
    CommandLine|contains:
      - '/r'
      - '/s'
      - '-r'
      - '-s'
  selection_force:
    CommandLine|contains:
      - '/f'
      - '-f'
  condition: all of selection_*
falsepositives:
  - 'Administrators, patching and deployment tools restarting servers'
level: low
