title: 'Partition Table or File System Signatures Wiped on Linux'
id: bf8c8e94-29e4-40eb-9f30-5f5ad8f1737f
status: experimental
description: 'Detects wipefs -a and sgdisk --zap-all / -Z, which erase partition tables and file system signatures so a disk no longer boots or mounts.'
references:
  - https://attack.mitre.org/techniques/T1561/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1561.002
logsource:
  category: process_creation
  product: linux
detection:
  selection_wipefs_img:
    Image|endswith: '/wipefs'
  selection_wipefs_all:
    CommandLine|contains:
      - ' -a'
      - ' --all'
  selection_sgdisk_img:
    Image|endswith: '/sgdisk'
  selection_sgdisk_zap:
    CommandLine|contains:
      - '--zap'
      - ' -Z'
  condition: (selection_wipefs_img and selection_wipefs_all) or (selection_sgdisk_img and selection_sgdisk_zap)
falsepositives:
  - 'Provisioning, OS installation and disk re-use scripts'
level: high
