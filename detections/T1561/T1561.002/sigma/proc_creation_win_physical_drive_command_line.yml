title: 'Physical Drive Referenced on the Command Line'
id: 60ea8239-1a22-4ddc-9e59-ecbbac92c8a6
status: experimental
description: 'Detects a command line that names a raw physical drive (\\.\PhysicalDrive), as used by wipers and boot-sector tools to overwrite the MBR, GPT or disk contents.'
references:
  - https://attack.mitre.org/techniques/T1561/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1561.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains: '\\.\PhysicalDrive'
  condition: selection
falsepositives:
  - 'Disk imaging, forensic and backup tools'
level: high
