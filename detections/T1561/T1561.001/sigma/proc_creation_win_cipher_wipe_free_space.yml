title: 'Free Disk Space Wiped with cipher /w'
id: a101518c-a089-4552-a193-17b02d9e3928
status: experimental
description: 'Detects cipher /w, which overwrites all free space on a volume; used by wipers and to destroy deleted evidence.'
references:
  - https://attack.mitre.org/techniques/T1561/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1561.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cipher.exe'
    CommandLine|contains: '/w'
  condition: selection
falsepositives:
  - 'Users and decommissioning scripts securely wiping free space'
level: medium
