title: 'Raw Disk Device Overwritten with dd or shred'
id: cbb500d4-d0b6-4e39-b0f2-099e4f861048
status: experimental
description: 'Detects dd writing to a whole disk device (of=/dev/sd*, nvme*, vd*, xvd*, hd*, mmcblk*) and shred run on a /dev device, which destroy disk contents.'
references:
  - https://attack.mitre.org/techniques/T1561/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.impact
  - attack.t1561.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_dd_img:
    Image|endswith: '/dd'
  selection_dd_target:
    CommandLine|contains:
      - 'of=/dev/sd'
      - 'of=/dev/nvme'
      - 'of=/dev/vd'
      - 'of=/dev/xvd'
      - 'of=/dev/hd'
      - 'of=/dev/mmcblk'
  selection_shred_img:
    Image|endswith: '/shred'
  selection_shred_target:
    CommandLine|contains: '/dev/'
  condition: (selection_dd_img and selection_dd_target) or (selection_shred_img and selection_shred_target)
falsepositives:
  - 'Disk imaging, secure decommissioning and OS installers'
level: high
