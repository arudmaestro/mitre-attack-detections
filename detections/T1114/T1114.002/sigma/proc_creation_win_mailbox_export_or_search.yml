title: 'Mailbox Export or Bulk Mail Search from the Command Line'
id: 9cd15d69-fc7f-44a6-84bb-378a5da839c4
status: experimental
description: 'Detects Exchange mailbox export requests (New-MailboxExportRequest) and MailSniper mailbox search functions run from a command line.'
references:
  - https://attack.mitre.org/techniques/T1114/002/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.collection
  - attack.t1114.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'New-MailboxExportRequest'
      - 'Invoke-SelfSearch'
      - 'Invoke-GlobalMailSearch'
  condition: selection
falsepositives:
  - 'Exchange administrators exporting mailboxes for legal hold or migration'
level: medium
