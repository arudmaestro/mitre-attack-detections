title: 'WMIC Loading a Remote XSL Stylesheet'
id: fd90b1e0-4182-4fae-87f2-f5780cf342cd
status: experimental
description: 'Detects wmic.exe with a /format: argument pointing to an http(s) URL, which downloads and runs script embedded in the XSL file.'
references:
  - https://attack.mitre.org/techniques/T1220/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1220
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|contains:
      - 'format:http'
  condition: selection
falsepositives:
  - 'None expected'
level: high
