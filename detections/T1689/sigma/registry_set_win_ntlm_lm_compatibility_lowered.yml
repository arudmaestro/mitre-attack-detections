title: 'NTLM Compatibility Level Lowered (LM / NTLMv1 Allowed)'
id: 519b41fd-fdb1-4642-9db8-e41b5a8cb10a
status: experimental
description: 'Detects LmCompatibilityLevel set to 0, 1 or 2, which lets the host send LM or NTLMv1 responses that can be cracked or relayed easily.'
references:
  - https://attack.mitre.org/techniques/T1689/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.defense-impairment
  - attack.t1689
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Control\Lsa\LmCompatibilityLevel'
    Details:
      - 'DWORD (0x00000000)'
      - 'DWORD (0x00000001)'
      - 'DWORD (0x00000002)'
  condition: selection
falsepositives:
  - 'Legacy application compatibility settings (should be documented exceptions)'
level: high
