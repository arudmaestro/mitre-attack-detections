title: 'Installed Applications Listed with system_profiler'
id: 12110f03-c8b4-410d-974d-14d25c55e5af
status: experimental
description: 'Detects system_profiler SPApplicationsDataType, which lists installed applications on macOS.'
references:
  - https://attack.mitre.org/techniques/T1518/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1518
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/system_profiler'
    CommandLine|contains: 'SPApplicationsDataType'
  condition: selection
falsepositives:
  - 'Inventory and MDM tools'
level: low
