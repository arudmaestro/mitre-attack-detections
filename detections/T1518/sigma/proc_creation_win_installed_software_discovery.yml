title: 'Installed Software Discovery on Windows'
id: 2b2c2687-ec62-45d9-b448-510683d060ef
status: experimental
description: 'Detects listing of installed software through the Uninstall registry key, the Win32_Product WMI class or wmic product.'
references:
  - https://attack.mitre.org/techniques/T1518/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1518
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    CommandLine|contains:
      - '\CurrentVersion\Uninstall'
      - 'Win32_Product'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains: ' product'
  condition: 1 of selection_*
falsepositives:
  - 'Inventory, patch-management and support tools'
level: low
