title: 'Security Software Discovery on Windows'
id: a1109a39-c8b5-4397-a9c3-4f4fbaeb60bc
status: experimental
description: 'Detects queries for installed antivirus and firewall products (SecurityCenter2 WMI classes), Defender status and preferences, and fltmc listing of filter drivers (which reveals EDR drivers).'
references:
  - https://attack.mitre.org/techniques/T1518/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1518.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_cmd:
    CommandLine|contains:
      - 'SecurityCenter2'
      - 'AntiVirusProduct'
      - 'FirewallProduct'
      - 'Get-MpComputerStatus'
      - 'Get-MpPreference'
  selection_fltmc:
    Image|endswith: '\fltMC.exe'
  condition: 1 of selection_*
falsepositives:
  - 'Inventory, compliance and support tools checking antivirus status'
level: low
