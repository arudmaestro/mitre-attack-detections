title: 'Web Server Process Running Discovery or Download Tools on Linux'
id: afe8a1d7-ac74-4bbd-ab20-37106fdf3a9d
status: experimental
description: 'Detects Apache, nginx, lighttpd or PHP-FPM processes directly starting download, network or interpreter tools (curl, wget, nc, python, perl, id, uname, whoami), typical of web shell activity.'
references:
  - https://attack.mitre.org/techniques/T1505/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.t1505.003
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    ParentImage|endswith:
      - '/httpd'
      - '/apache2'
      - '/nginx'
      - '/lighttpd'
  selection_php:
    ParentImage|contains: '/php-fpm'
  selection_child:
    Image|endswith:
      - '/curl'
      - '/wget'
      - '/nc'
      - '/ncat'
      - '/netcat'
      - '/python'
      - '/python3'
      - '/perl'
      - '/id'
      - '/uname'
      - '/whoami'
  condition: (selection_parent or selection_php) and selection_child
falsepositives:
  - 'Web applications that call these tools by design (allowlist by command line)'
level: high
