title: 'Web Server Process Running Discovery or Download Tools on Windows'
id: 6a1bebc4-1f25-4a85-8307-2149fc13bd6c
status: experimental
description: 'Detects IIS, Apache, nginx, PHP or Tomcat processes directly starting discovery or download tools (net, ipconfig, systeminfo, nltest, quser, tasklist, certutil, curl, bitsadmin), typical of web shell activity.'
references:
  - https://attack.mitre.org/techniques/T1505/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.t1505.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\httpd.exe'
      - '\nginx.exe'
      - '\php-cgi.exe'
      - '\tomcat.exe'
      - '\tomcat8.exe'
      - '\tomcat9.exe'
  selection_child:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
      - '\ipconfig.exe'
      - '\systeminfo.exe'
      - '\nltest.exe'
      - '\quser.exe'
      - '\query.exe'
      - '\tasklist.exe'
      - '\hostname.exe'
      - '\certutil.exe'
      - '\curl.exe'
      - '\bitsadmin.exe'
      - '\reg.exe'
  condition: all of selection_*
falsepositives:
  - 'Web applications that query system information through command-line tools by design'
level: high
