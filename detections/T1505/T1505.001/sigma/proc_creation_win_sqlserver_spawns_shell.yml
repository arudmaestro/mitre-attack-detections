title: 'SQL Server Spawning a Shell or Script Host'
id: e56f63df-b098-4f52-877c-99b680480627
status: experimental
description: 'Detects sqlservr.exe starting a shell, script host or proxy binary, the result of xp_cmdshell, OLE automation or CLR procedures running commands.'
references:
  - https://attack.mitre.org/techniques/T1505/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.t1505.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\sqlservr.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: all of selection_*
falsepositives:
  - 'Database jobs that use xp_cmdshell by design (allowlist by command line)'
level: high
