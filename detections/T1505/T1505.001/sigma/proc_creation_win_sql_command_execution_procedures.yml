title: 'SQL Command-Execution Procedure Used from the Command Line'
id: 6dbc26be-5d70-459f-9a07-ec5369985e3d
status: experimental
description: 'Detects command lines (sqlcmd, PowerShell, tools) that enable or call xp_cmdshell, sp_OACreate or sp_addextendedproc.'
references:
  - https://attack.mitre.org/techniques/T1505/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.persistence
  - attack.t1505.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'xp_cmdshell'
      - 'sp_OACreate'
      - 'sp_addextendedproc'
  condition: selection
falsepositives:
  - 'DBAs and deployment scripts that configure these procedures'
level: medium
