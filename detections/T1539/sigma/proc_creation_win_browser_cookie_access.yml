title: 'Browser Cookie Store Accessed from the Command Line on Windows'
id: 79982d61-6ace-4bd5-8548-2febed2dfb8b
status: experimental
description: 'Detects a command line that references browser cookie stores (Chromium Cookies databases, Firefox cookies.sqlite), typical of cookie-theft scripts and tools.'
references:
  - https://attack.mitre.org/techniques/T1539/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.credential-access
  - attack.t1539
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - '\Network\Cookies'
      - '\User Data\Default\Cookies'
      - '\cookies.sqlite'
  condition: selection
falsepositives:
  - 'Backup, browser-migration and forensic tools'
level: medium
