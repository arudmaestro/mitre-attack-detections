title: 'VMware Tools Started a Shell or Script Host'
id: 8f4ac52d-a6f3-4584-b761-2393f9e3469a
status: experimental
description: 'Detects vmtoolsd.exe (VMware Tools in a Windows guest) starting cmd, PowerShell or script hosts, other than the built-in power scripts; ESXi guest operations (Invoke-VMScript, vmrun runProgramInGuest) run commands this way from the hypervisor.'
references:
  - https://attack.mitre.org/techniques/T1675/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.execution
  - attack.t1675
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\vmtoolsd.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  filter_power_scripts:
    CommandLine|contains:
      - 'poweron-vm-default'
      - 'poweroff-vm-default'
      - 'resume-vm-default'
      - 'suspend-vm-default'
  condition: selection and not filter_power_scripts
falsepositives:
  - 'VMware administrators running guest scripts with PowerCLI Invoke-VMScript'
level: medium
