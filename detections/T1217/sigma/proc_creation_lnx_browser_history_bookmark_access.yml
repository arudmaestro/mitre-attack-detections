title: 'Browser Bookmarks or History Read from the Command Line on Linux'
id: 2d631b1c-4d9c-4c05-96ef-bd6c119ac120
status: experimental
description: 'Detects a command line that references Chrome/Chromium Bookmarks/History files or the Firefox places.sqlite database.'
references:
  - https://attack.mitre.org/techniques/T1217/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1217
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - '/google-chrome/Default/Bookmarks'
      - '/google-chrome/Default/History'
      - '/chromium/Default/Bookmarks'
      - '/chromium/Default/History'
      - '/places.sqlite'
  condition: selection
falsepositives:
  - 'Backup and browser-migration scripts'
level: low
