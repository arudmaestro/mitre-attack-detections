title: 'Browser Bookmarks or History Read from the Command Line on macOS'
id: 8615f463-c2d6-419a-929f-f35ee4a45ad1
status: experimental
description: 'Detects a command line that references Safari History.db/Bookmarks.plist, Chrome History/Bookmarks or the Firefox places.sqlite database.'
references:
  - https://attack.mitre.org/techniques/T1217/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1217
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    CommandLine|contains:
      - '/Library/Safari/History.db'
      - '/Library/Safari/Bookmarks.plist'
      - '/Google/Chrome/Default/History'
      - '/Google/Chrome/Default/Bookmarks'
      - '/places.sqlite'
  condition: selection
falsepositives:
  - 'Backup and browser-migration scripts'
level: low
