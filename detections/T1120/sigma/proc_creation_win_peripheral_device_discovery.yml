title: 'Peripheral and Drive Discovery on Windows'
id: fcf85c81-39e7-4124-b79f-fca20f4bc8cc
status: experimental
description: 'Detects enumeration of drives and devices with fsutil fsinfo drives, WMIC disk/USB/PnP queries or Get-PnpDevice.'
references:
  - https://attack.mitre.org/techniques/T1120/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.discovery
  - attack.t1120
logsource:
  category: process_creation
  product: windows
detection:
  selection_fsutil:
    Image|endswith: '\fsutil.exe'
    CommandLine|contains: 'fsinfo drives'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains:
      - 'logicaldisk'
      - 'diskdrive'
      - 'usbcontroller'
      - 'win32_pnpentity'
  selection_ps:
    CommandLine|contains: 'Get-PnpDevice'
  condition: 1 of selection_*
falsepositives:
  - 'Inventory, support and device-management tools'
level: low
