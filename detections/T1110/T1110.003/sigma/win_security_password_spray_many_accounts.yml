---
title: 'Failed Logons for Many Accounts from One Source'
id: bcfe7244-3339-4a31-9467-01c3db407ff2
status: experimental
description: 'Detects failed Windows logons (4625) for 10 or more different accounts from the same source IP within 1 hour, a sign of password spraying.'
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - win_security_password_spray_many_accounts_events
  group-by:
    - IpAddress
  timespan: 1h
  condition:
    gte: 10
    field: TargetUserName
falsepositives:
  - 'Shared jump hosts, VDI or Citrix servers where many users mistype passwords'
  - 'Vulnerability scanners with credentialed checks'
level: high
