title: 'Failed Windows network logon (4625)'
id: f738b5e6-f954-415b-ab0a-5726491977fd
name: win_security_password_spray_many_accounts_events
status: experimental
description: 'Base events for: Failed Logons for Many Accounts from One Source'
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
