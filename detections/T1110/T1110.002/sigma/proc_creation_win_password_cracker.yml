title: 'Password Cracking Tool Executed on Windows'
id: 74caf145-a596-4764-ac59-a809a8a797eb
status: experimental
description: 'Detects hashcat or John the Ripper running on a Windows host.'
references:
  - https://attack.mitre.org/techniques/T1110/002/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1110.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\hashcat.exe'
      - '\john.exe'
  condition: selection
falsepositives:
  - 'Authorised password auditing by the security team'
level: medium
