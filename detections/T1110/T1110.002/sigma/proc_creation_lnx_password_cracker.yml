title: 'Password Cracking Tool Executed on Linux'
id: 959d118b-cce6-4172-acd9-17023c2c9bd4
status: experimental
description: 'Detects hashcat or John the Ripper running on a Linux host.'
references:
  - https://attack.mitre.org/techniques/T1110/002/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.credential-access
  - attack.t1110.002
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
      - '/hashcat'
      - '/john'
  condition: selection
falsepositives:
  - 'Authorised password auditing by the security team'
level: medium
