title: 'File Decoded with certutil'
id: 50c5dbda-88a4-49e5-90ea-0e856826a510
status: experimental
description: 'Detects certutil decoding Base64 or hex encoded files (-decode, -decodehex), a common way to unpack downloaded payloads.'
references:
  - https://attack.mitre.org/techniques/T1140/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.stealth
  - attack.t1140
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - '-decode'
      - '/decode'
  condition: selection
falsepositives:
  - 'Administrators decoding certificates or files'
level: medium
