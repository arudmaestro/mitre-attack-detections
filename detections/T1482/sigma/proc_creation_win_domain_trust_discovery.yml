title: 'Domain Trust Discovery'
id: 0452775f-affc-47b6-9543-0dedd6b22443
status: experimental
description: 'Detects enumeration of Active Directory domain and forest trusts with nltest, dsquery, the AD PowerShell module, PowerView or the .NET GetAllTrustRelationships method.'
references:
  - https://attack.mitre.org/techniques/T1482/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - '/domain_trusts'
      - '/all_trusts'
      - '/trusted_domains'
      - 'trustedDomain'
      - 'Get-ADTrust'
      - 'Get-DomainTrust'
      - 'Get-NetDomainTrust'
      - 'Get-ForestTrust'
      - 'GetAllTrustRelationships'
  condition: selection
falsepositives:
  - 'Administrators and AD health or audit scripts reviewing trusts'
level: medium
