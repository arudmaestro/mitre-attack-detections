title: 'Security Event Log Queried from the Command Line'
id: 8fdbc9bf-1ecc-4ab6-81f7-4e41e724eb36
status: experimental
description: 'Detects wevtutil qe, Get-WinEvent or Get-EventLog reading the Security log, used to find logon records of administrators and other accounts to target.'
references:
  - https://attack.mitre.org/techniques/T1654/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.discovery
  - attack.t1654
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil_img:
    Image|endswith: '\wevtutil.exe'
  selection_wevtutil_query:
    CommandLine|contains:
      - ' qe '
      - ' query-events '
  selection_ps:
    CommandLine|contains:
      - 'Get-WinEvent'
      - 'Get-EventLog'
  selection_security:
    CommandLine|contains: 'Security'
  condition: ((selection_wevtutil_img and selection_wevtutil_query) or selection_ps) and selection_security
falsepositives:
  - 'Administrators and monitoring scripts reading the Security log'
level: low
