title: 'Sound Recorder Writing Audio to a File'
id: a2208632-ae23-48c9-b427-08626c310d7d
status: experimental
description: 'Detects the legacy SoundRecorder.exe recording straight to a file (/FILE), used to capture microphone audio from scripts.'
references:
  - https://attack.mitre.org/techniques/T1123/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.collection
  - attack.t1123
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\SoundRecorder.exe'
    CommandLine|contains: '/FILE'
  condition: selection
falsepositives:
  - 'Rare: scripted legitimate recordings'
level: medium
