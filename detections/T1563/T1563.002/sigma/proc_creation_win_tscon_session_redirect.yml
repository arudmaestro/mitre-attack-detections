title: 'RDP Session Connected to Another Session with tscon'
id: 07d06103-89e8-46cd-8984-b37aa58a5509
status: experimental
description: 'Detects tscon with /dest:, which attaches an existing (often disconnected) user session to another session; run as SYSTEM it takes over another user''s RDP session without their password.'
references:
  - https://attack.mitre.org/techniques/T1563/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.lateral-movement
  - attack.t1563.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\tscon.exe'
    CommandLine|contains: '/dest:'
  condition: selection
falsepositives:
  - 'Administrators reconnecting their own sessions (rare)'
level: high
