title: 'Signed Windows Script Used to Run a Command'
id: af17777d-d97d-4c82-8399-63e0bfe114f4
status: experimental
description: 'Detects use of Microsoft-signed diagnostic and management scripts that can start other programs (CL_Invocation.ps1 SyncInvoke, CL_Mutexverifiers.ps1 runAfterCancelProcess, manage-bde.wsf).'
references:
  - https://attack.mitre.org/techniques/T1216/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1216
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'CL_Invocation.ps1'
      - 'CL_Mutexverifiers.ps1'
      - 'SyncInvoke'
      - 'runAfterCancelProcess'
      - 'manage-bde.wsf'
  condition: selection
falsepositives:
  - 'Windows troubleshooting packs running their own scripts'
level: medium
