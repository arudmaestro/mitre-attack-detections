title: 'SyncAppvPublishingServer Used to Run PowerShell'
id: 33863255-b152-41dc-b924-9faa5ddd5156
status: experimental
description: 'Detects SyncAppvPublishingServer (.exe or .vbs) called with an argument containing a semicolon, the injection used to run PowerShell commands through this signed App-V script.'
references:
  - https://attack.mitre.org/techniques/T1216/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1216.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
      - 'SyncAppvPublishingServer'
      - ';'
  condition: selection
falsepositives:
  - 'App-V publishing refreshes with unusual arguments (rare)'
level: medium
