title: 'Container Image Built on a Host'
id: 0a97e521-d000-4366-9a60-b56d353cf456
status: experimental
description: 'Detects docker, podman, buildah or nerdctl building an image on the host; on servers that are not build machines, a local build can hide a malicious image from registry scanning.'
references:
  - https://attack.mitre.org/techniques/T1612/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.stealth
  - attack.t1612
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
      - '/docker'
      - '/podman'
      - '/buildah'
      - '/nerdctl'
  selection_build:
    CommandLine|contains:
      - ' build '
      - ' buildx '
      - ' bud '
  condition: all of selection_*
falsepositives:
  - 'Developer workstations and CI build agents (scope the rule to production servers)'
level: low
