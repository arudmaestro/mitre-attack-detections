title: 'IDE or Dev Tunnel Started on Linux'
id: 1d9dea81-f88e-4827-8edb-b5f47796eee3
status: experimental
description: 'Detects VS Code Remote Tunnels (code tunnel / code-tunnel) and Microsoft Dev Tunnels hosting (devtunnel host).'
references:
  - https://attack.mitre.org/techniques/T1219/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.command-and-control
  - attack.t1219.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_code_tunnel:
    Image|endswith: '/code-tunnel'
  selection_code:
    Image|endswith: '/code'
    CommandLine|contains: ' tunnel'
  selection_devtunnel:
    Image|endswith: '/devtunnel'
    CommandLine|contains: ' host'
  condition: 1 of selection_*
falsepositives:
  - 'Developers using VS Code Remote Tunnels or Dev Tunnels with approval'
level: medium
