title: 'Remote Access Tool Executed on macOS'
id: 3077e571-2412-4f96-bb29-b15160d0cbc4
status: experimental
description: 'Detects execution of common remote access / RMM tools (AnyDesk, TeamViewer, RustDesk and others), which attackers install for persistent interactive access.'
references:
  - https://attack.mitre.org/techniques/T1219/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.command-and-control
  - attack.t1219.002
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith:
      - '/AnyDesk'
      - '/TeamViewer'
      - '/RustDesk'
  condition: selection
falsepositives:
  - 'Approved remote support tools'
level: medium
