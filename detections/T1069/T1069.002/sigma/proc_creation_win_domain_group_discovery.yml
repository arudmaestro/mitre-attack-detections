title: 'Domain Group Membership Discovery'
id: d85ecf95-9135-4091-b756-b9f25739e1be
status: experimental
description: 'Detects domain group enumeration with net group /domain (without /add or /delete), Get-ADGroupMember, or PowerView group functions.'
references:
  - https://attack.mitre.org/techniques/T1069/002/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.discovery
  - attack.t1069.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_net:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
    CommandLine|contains|all:
      - 'group'
      - '/domain'
  filter_change:
    CommandLine|contains:
      - '/add'
      - '/delete'
  selection_ps:
    CommandLine|contains:
      - 'Get-ADGroupMember'
      - 'Get-DomainGroupMember'
      - 'Get-NetGroupMember'
  condition: (selection_net and not filter_change) or selection_ps
falsepositives:
  - 'Administrators and identity management scripts'
level: low
