title: 'Systemd Timer Enabled or Transient Timer Created'
id: ca8cef7c-7dd7-4f01-88e6-686a26206dc8
status: experimental
description: 'Detects systemctl enabling or starting a .timer unit, or systemd-run creating a transient timer (--on-calendar, --on-active, etc.).'
references:
  - https://attack.mitre.org/techniques/T1053/006/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.006
logsource:
  category: process_creation
  product: linux
detection:
  selection_systemctl:
    Image|endswith: '/systemctl'
    CommandLine|contains: '.timer'
  selection_action:
    CommandLine|contains:
      - ' enable'
      - ' start'
  selection_run:
    Image|endswith: '/systemd-run'
    CommandLine|contains:
      - '--on-calendar'
      - '--on-active'
      - '--on-boot'
      - '--on-startup'
      - '--on-unit-active'
  condition: (selection_systemctl and selection_action) or selection_run
falsepositives:
  - 'Package installation scripts enabling vendor timers'
  - 'Administrators'
level: low
