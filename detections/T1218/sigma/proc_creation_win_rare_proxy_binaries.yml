title: 'Rarely Used Windows Binary Known for Proxy Execution'
id: 8454916a-74b1-4627-a44d-05865a6d55b6
status: experimental
description: 'Detects execution of Microsoft-signed binaries that are almost never used legitimately but can run attacker code: Microsoft.Workflow.Compiler, Register-CimProvider, InfDefaultInstall and IEExec.'
references:
  - https://attack.mitre.org/techniques/T1218/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\Microsoft.Workflow.Compiler.exe'
      - '\Register-CimProvider.exe'
      - '\InfDefaultInstall.exe'
      - '\ieexec.exe'
  condition: selection
falsepositives:
  - 'Driver or software installers that use InfDefaultInstall'
level: medium
