title: 'MSDT Started with Diagnostic Parameters Used by Follina'
id: d3280590-191c-40ff-8fb1-d35cb16e9ae4
status: experimental
description: 'Detects msdt.exe started with the PCWDiagnostic pack or the IT_BrowseForFile parameter, as used by CVE-2022-30190 (Follina) documents.'
references:
  - https://attack.mitre.org/techniques/T1218/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\msdt.exe'
    CommandLine|contains:
      - 'PCWDiagnostic'
      - 'IT_BrowseForFile'
  condition: selection
falsepositives:
  - 'Users running the Program Compatibility Troubleshooter manually'
level: high
