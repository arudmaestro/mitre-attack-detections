title: 'Odbcconf Registering a DLL or Using a Response File'
id: 2bc82bfc-ff6a-4322-a9fb-8304f100ef0a
status: experimental
description: 'Detects odbcconf.exe with the REGSVR action (loads a DLL) or a response file (.rsp), both used to run attacker DLLs.'
references:
  - https://attack.mitre.org/techniques/T1218/008/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.008
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\odbcconf.exe'
  selection_args:
    CommandLine|contains:
      - 'regsvr'
      - '.rsp'
  condition: all of selection_*
falsepositives:
  - 'Database driver installers registering ODBC driver DLLs'
level: medium
