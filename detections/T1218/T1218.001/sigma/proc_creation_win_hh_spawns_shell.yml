title: 'HTML Help (hh.exe) Spawning a Shell or Script Host'
id: e27486a4-1dd2-477e-879c-33872871611f
status: experimental
description: 'Detects hh.exe starting a shell, script host or proxy binary, which a malicious compiled HTML help (.chm) file does through embedded script.'
references:
  - https://attack.mitre.org/techniques/T1218/001/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\hh.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: all of selection_*
falsepositives:
  - 'Old vendor help files that launch tools (rare)'
level: high
