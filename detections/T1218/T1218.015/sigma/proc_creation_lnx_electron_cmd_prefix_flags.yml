title: 'Electron or Chromium Application Started with a Command-Launching Switch on Linux'
id: e43d1160-71a5-4dae-aa8f-bfc149dc3d1c
status: experimental
description: 'Detects Chromium command-line switches that make an Electron or Chromium application run another program (--gpu-launcher, --utility-cmd-prefix, --renderer-cmd-prefix, --browser-subprocess-path).'
references:
  - https://attack.mitre.org/techniques/T1218/015/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.015
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - '--gpu-launcher='
      - '--utility-cmd-prefix='
      - '--renderer-cmd-prefix='
      - '--browser-subprocess-path='
  condition: selection
falsepositives:
  - 'Developers debugging Chromium or Electron applications'
level: medium
