title: 'Mavinject Injecting a DLL into a Running Process'
id: f127aed8-8f21-477c-bad1-a10b2f19a069
status: experimental
description: 'Detects mavinject.exe with /INJECTRUNNING, which loads a DLL into another running process.'
references:
  - https://attack.mitre.org/techniques/T1218/013/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.013
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\mavinject.exe'
    CommandLine|contains: '/INJECTRUNNING'
  condition: selection
falsepositives:
  - 'Microsoft App-V client injecting its virtualization DLL'
level: high
