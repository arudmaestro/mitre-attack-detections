title: 'MMC Opening a Console File from a User-Writable Folder'
id: eaedae5f-107d-404e-9a88-47e03da29db3
status: experimental
description: 'Detects mmc.exe opening a .msc console from Temp, AppData, Downloads or the public profile; malicious .msc files (e.g. GrimResource) run script when opened.'
references:
  - https://attack.mitre.org/techniques/T1218/014/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.014
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\mmc.exe'
    CommandLine|contains: '.msc'
  selection_path:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Downloads\'
      - '\Users\Public\'
  condition: all of selection_*
falsepositives:
  - 'Administrators opening saved custom consoles from their profile'
level: medium
