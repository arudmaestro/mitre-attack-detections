title: 'MMC Spawning a Shell or Script Host'
id: a003f5df-89bd-4807-8c7f-51cddc451244
status: experimental
description: 'Detects mmc.exe starting a shell, script host or proxy binary.'
references:
  - https://attack.mitre.org/techniques/T1218/014/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.014
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\mmc.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: all of selection_*
falsepositives:
  - 'Custom consoles with task items that start command-line tools'
level: medium
