title: 'InstallUtil Used to Run Code'
id: 13944f8b-eb33-4d82-a1ad-294581ea901d
status: experimental
description: 'Detects InstallUtil.exe running an assembly from a user-writable folder, or with the logging switches (/logfile= /LogToConsole=false) used in public bypass examples.'
references:
  - https://attack.mitre.org/techniques/T1218/004/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.004
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\InstallUtil.exe'
  selection_path:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Downloads\'
      - '\Users\Public\'
  selection_switches:
    CommandLine|contains|all:
      - '/logfile='
      - '/LogToConsole=false'
  condition: selection_img and (selection_path or selection_switches)
falsepositives:
  - 'Developers installing Windows services they built from a user folder'
level: medium
