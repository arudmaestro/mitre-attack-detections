title: 'Rundll32 Running Inline JavaScript through mshtml'
id: 05b4f23a-49b9-4ab8-87f7-e11e01b99b90
status: experimental
description: 'Detects rundll32.exe with a javascript: argument or mshtml RunHTMLApplication, used to run script code without a file.'
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\rundll32.exe'
  selection_args:
    CommandLine|contains:
      - 'javascript:'
      - 'RunHTMLApplication'
  condition: all of selection_*
falsepositives:
  - 'None expected'
level: high
