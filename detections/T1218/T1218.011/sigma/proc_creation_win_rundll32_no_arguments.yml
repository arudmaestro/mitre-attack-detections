title: 'Rundll32 Started without Arguments'
id: b588c84c-920e-4b1d-b843-7a40d7615048
status: experimental
description: 'Detects rundll32.exe whose command line ends with the program name (no DLL argument). Command-and-control frameworks start rundll32 this way as a sacrificial process to inject into.'
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|endswith: 'rundll32.exe'
  condition: selection
falsepositives:
  - 'Rare: broken shortcuts or scripts calling rundll32 without arguments'
level: medium
