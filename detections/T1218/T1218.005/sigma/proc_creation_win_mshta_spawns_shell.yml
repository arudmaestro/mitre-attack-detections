title: 'Mshta Spawning a Shell or Script Host'
id: 0edc6b44-7c34-4d3a-bd96-42364b2fb523
status: experimental
description: 'Detects mshta.exe starting a shell, script host or proxy binary.'
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\mshta.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: all of selection_*
falsepositives:
  - 'Legacy HTA-based installers and admin tools'
level: high
