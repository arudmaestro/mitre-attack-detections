title: 'Verclsid Started by a Process Other than Explorer'
id: fb87e55a-d68c-4be6-b131-14ff0cae71c2
status: experimental
description: 'Detects verclsid.exe (/S /C {CLSID}) started by something other than explorer.exe. Explorer uses verclsid to check shell extensions; attackers use it to load a registered COM object.'
references:
  - https://attack.mitre.org/techniques/T1218/012/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.012
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\verclsid.exe'
    CommandLine|contains|all:
      - '/S'
      - '/C'
  filter_explorer:
    ParentImage|endswith: '\explorer.exe'
  condition: selection and not filter_explorer
falsepositives:
  - 'Other shell hosts (file dialogs in applications) that verify shell extensions'
level: low
