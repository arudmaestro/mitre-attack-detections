title: 'Regsvr32 Loading a Scriptlet (Squiblydoo)'
id: 9e5788da-468a-48b3-bddb-418d8537ecb8
status: experimental
description: 'Detects regsvr32.exe loading scrobj.dll or a remote scriptlet with /i:http, the Squiblydoo technique.'
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\regsvr32.exe'
  selection_args:
    CommandLine|contains:
      - 'scrobj.dll'
      - '/i:http'
      - '-i:http'
  condition: all of selection_*
falsepositives:
  - 'None expected'
level: high
