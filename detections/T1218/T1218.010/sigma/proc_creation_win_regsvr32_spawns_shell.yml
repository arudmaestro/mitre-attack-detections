title: 'Regsvr32 Spawning a Shell or Script Host'
id: 2084a3da-6891-4f66-bf85-f339cccd5276
status: experimental
description: 'Detects regsvr32.exe starting a shell, script host or proxy binary, which happens when a registered DLL or scriptlet runs a payload.'
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\regsvr32.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
  condition: all of selection_*
falsepositives:
  - 'Installers whose COM registration runs setup commands'
level: high
