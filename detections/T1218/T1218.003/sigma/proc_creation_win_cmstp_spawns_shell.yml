title: 'CMSTP Spawning a Shell or Script Host'
id: c712b390-70f9-41d1-b8bb-e0879a9e0afe
status: experimental
description: 'Detects cmstp.exe starting a shell, script host or proxy binary, which happens when an INF file''s RunPreSetupCommands section runs a payload.'
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith: '\cmstp.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: all of selection_*
falsepositives:
  - 'Rare: VPN profiles that run setup scripts'
level: high
