title: 'CMSTP Installing a Profile Silently'
id: 654668d8-be20-438a-9637-a4a244f3286d
status: experimental
description: 'Detects cmstp.exe installing a connection profile INF silently or for all users (/s, /au, /ni), the way malicious INF files with RunPreSetupCommands are run.'
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith: '\cmstp.exe'
    CommandLine|contains: '.inf'
  selection_flags:
    CommandLine|contains:
      - '/s'
      - '/au'
      - '/ni'
  condition: all of selection_*
falsepositives:
  - 'VPN client deployments that install Connection Manager profiles'
level: medium
