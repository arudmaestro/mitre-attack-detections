title: 'Control Panel Item Loaded from a User-Writable Folder'
id: b55a0044-d2d1-494c-9895-94cc617afa39
status: experimental
description: 'Detects control.exe or rundll32 shell32.dll,Control_RunDLL loading a .cpl file from Temp, AppData, Downloads or the public profile. Legitimate Control Panel items live in System32 or Program Files.'
references:
  - https://attack.mitre.org/techniques/T1218/002/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.stealth
  - attack.t1218.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_control:
    Image|endswith: '\control.exe'
  selection_rundll:
    CommandLine|contains: 'Control_RunDLL'
  selection_cpl:
    CommandLine|contains: '.cpl'
  selection_path:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Downloads\'
      - '\Users\Public\'
  condition: (selection_control or selection_rundll) and selection_cpl and selection_path
falsepositives:
  - 'Software installers that open their own Control Panel item from a temporary folder'
level: medium
