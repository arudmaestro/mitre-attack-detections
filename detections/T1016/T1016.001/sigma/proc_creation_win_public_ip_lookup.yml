title: 'Public IP or Internet Connectivity Lookup Service in Command Line'
id: 4315208a-2f8d-4e73-a475-15498af51a4e
status: experimental
description: 'Detects command lines contacting well-known public IP lookup services, used to confirm Internet access and learn the egress IP.'
references:
  - https://attack.mitre.org/techniques/T1016/001/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.discovery
  - attack.t1016.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'api.ipify.org'
      - 'ifconfig.me'
      - 'icanhazip.com'
      - 'ipinfo.io'
      - 'checkip.amazonaws.com'
      - 'myip.opendns.com'
      - 'ip-api.com'
      - 'wtfismyip.com'
      - 'checkip.dyndns.org'
  condition: selection
falsepositives:
  - IT scripts and VPN or monitoring tools that check the public IP
level: medium
