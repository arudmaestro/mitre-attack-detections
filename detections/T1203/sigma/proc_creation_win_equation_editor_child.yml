title: 'Equation Editor Starting a Process'
id: bdddff59-9488-4ca9-b3d2-37bd31d92d3e
status: experimental
description: 'Detects the legacy Office Equation Editor (EQNEDT32.EXE) starting any process, the result of CVE-2017-11882 and CVE-2018-0802 exploits.'
references:
  - https://attack.mitre.org/techniques/T1203/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.execution
  - attack.t1203
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\EQNEDT32.EXE'
  condition: selection
falsepositives:
  - 'None expected: the Equation Editor does not start other programs'
level: high
