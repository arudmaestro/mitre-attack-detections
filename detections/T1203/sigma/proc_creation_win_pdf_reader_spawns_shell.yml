title: 'PDF Reader Spawning a Shell or Script Host'
id: 4c2f1e5d-e475-47f8-823d-e60eb809fb0e
status: experimental
description: 'Detects Adobe Acrobat / Reader or Foxit starting a shell, script host or common proxy binary, a sign of a malicious PDF exploit.'
references:
  - https://attack.mitre.org/techniques/T1203/
author: Detection Engineering Team
date: 2026-11-24
tags:
  - attack.execution
  - attack.t1203
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\AcroRd32.exe'
      - '\Acrobat.exe'
      - '\FoxitPDFReader.exe'
      - '\FoxitReader.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
  condition: all of selection_*
falsepositives:
  - 'PDF forms or plug-ins that launch scripts by design (rare)'
level: high
