title: 'EventLog Service or Log Channel Disabled in the Registry'
id: 88599209-9ceb-4d1b-a650-794adc918098
status: experimental
description: 'Detects the EventLog service start type set to disabled (4) and a log channel''s Enabled value set to 0 under WINEVT\Channels.'
references:
  - https://attack.mitre.org/techniques/T1685/001/
author: Detection Engineering Team
date: 2026-11-25
tags:
  - attack.defense-impairment
  - attack.t1685.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_service:
    TargetObject|endswith: '\Services\EventLog\Start'
    Details: 'DWORD (0x00000004)'
  selection_channel:
    TargetObject|contains: '\WINEVT\Channels\'
    TargetObject|endswith: '\Enabled'
    Details: 'DWORD (0x00000000)'
  condition: 1 of selection_*
falsepositives:
  - 'Windows and software installers disabling noisy analytic / debug channels'
level: medium
