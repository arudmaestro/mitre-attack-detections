title: 'AWS AdministratorAccess Policy Attached'
id: 8acbc859-92b7-486c-8129-28ef852e900c
status: experimental
description: 'Detects the AWS managed AdministratorAccess policy being attached to a user, group or role.'
references:
  - https://attack.mitre.org/techniques/T1098/003/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
      - 'AttachUserPolicy'
      - 'AttachGroupPolicy'
      - 'AttachRolePolicy'
    requestParameters.policyArn|contains: 'policy/AdministratorAccess'
  condition: selection
falsepositives:
  - 'Administrators granting admin rights through change control'
level: high
