title: 'AWS IAM Access Key or Console Password Created'
id: 63d41250-2e8a-412f-8a55-fd74b65c261e
status: experimental
description: 'Detects creation of IAM access keys and creation or change of console login profiles, which give an attacker persistent credentials.'
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
      - 'CreateAccessKey'
      - 'CreateLoginProfile'
      - 'UpdateLoginProfile'
  condition: selection
falsepositives:
  - 'Administrators onboarding users or rotating keys'
  - 'Automation that rotates access keys'
level: medium
