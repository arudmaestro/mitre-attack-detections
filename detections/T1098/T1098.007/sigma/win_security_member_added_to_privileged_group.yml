title: 'Member Added to a Privileged Windows Group'
id: b914089c-0210-4304-84fd-2e508cf245f2
status: experimental
description: 'Detects a member being added to a privileged local or domain group (Administrators, Domain/Enterprise/Schema Admins, Remote Desktop Users, Backup or Account Operators).'
references:
  - https://attack.mitre.org/techniques/T1098/007/
author: Detection Engineering Team
date: 2026-11-23
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.007
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4728
      - 4732
      - 4756
    TargetUserName:
      - 'Administrators'
      - 'Domain Admins'
      - 'Enterprise Admins'
      - 'Schema Admins'
      - 'Remote Desktop Users'
      - 'Backup Operators'
      - 'Account Operators'
  condition: selection
falsepositives:
  - 'Administrators granting rights through change control'
level: high
